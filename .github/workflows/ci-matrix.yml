# Generated by enact from .enact; edit the pipeline and run `enact ci generate`.
name: grafana matrix
on:
  workflow_call:
    inputs:
      control_checkout_sha:
        type: string
        required: false
      control_pin_required:
        type: string
        required: false
      control_pr_head_sha:
        type: string
        required: false
      force_warm_suites:
        type: string
        required: false
      history_input_artifact:
        type: string
        required: false
      matrix:
        type: string
        required: true
      pin_reach_age_sha256:
        type: string
        required: false
      pin_reach_map_sha256:
        type: string
        required: false
      seed_caches:
        type: string
        required: false
      warm_reach:
        type: string
        required: false
permissions:
  contents: read
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  ENACT_REMOTE_SAVE_EVENT: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
  ENACT_SAVE_EVENT: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
  ENVE_CACHE_PUBLIC_KEY: enve-r2-1:ckHPTeWVef6mba+1AwWHjKYCsUWKPfP9IXPm5YXNoHg=
  ENVE_SERVICE_GID: "1000"
  ENVE_SERVICE_UID: "1000"
  ENVE_SUBSTITUTERS: https://cache.tonky.dev,https://cache.nixos.org
  ENVE_TRUSTED_PUBLIC_KEYS: enve-r2-1:ckHPTeWVef6mba+1AwWHjKYCsUWKPfP9IXPm5YXNoHg=
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GOCACHE: /tmp/go-build
  GOPATH: /tmp/go
  UV_CACHE_DIR: /tmp/.cache/uv
  XDG_CACHE_HOME: /tmp/.cache
jobs:
  entry:
    name: ${{ matrix.component }}${{ matrix.env.ENACT_SCHEDULING_HINT }}
    env:
      ENACT_ENVIRONMENT_FILE: ${{ matrix.environment_file || '' }}
      ENACT_HAS_SIGNING_KEY: ${{ (secrets.ENVE_CACHE_SECRET_KEY != '' || secrets.NIX_SECRET_KEY != '') && 'true' || 'false' }}
      ENACT_OBSERVATIONS_ENABLED: "1"
    permissions:
      actions: read
      contents: read
    if: ${{ inputs.matrix != '{"include":[]}' && inputs.matrix != '[]' && inputs.matrix != '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    steps:
    - name: Probe Runner Caches
      id: runner_caches
      run: |
        set -euo pipefail
        host="${ENACT_HOST_CACHE:-}"
        if [ -n "$host" ] && ! { [ -d "$host/repo" ] && [ -w "$host/repo" ]; }; then
            echo "::warning::ENACT_HOST_CACHE=$host has no writable repo/ directory; using GitHub's cache"
            host=""
        fi
        if [ -n "$host" ]; then
            mkdir -p "$host/repo/git" "$host/repo/outputs"
            echo "ENACT_GIT_MIRROR=$host/repo/git/${GITHUB_REPOSITORY##*/}.git" >> "$GITHUB_ENV"
            echo "ENACT_OUTPUTS_CACHE=$host/repo/outputs" >> "$GITHUB_ENV"
        fi
        echo "ENACT_HOST_CACHE=$host" >> "$GITHUB_ENV"
        printf 'host=%s\n' "$host" >> "$GITHUB_OUTPUT"
        printf 'Host cache: %s\n' "${host:-none}"
    - name: Checkout Repository (sparse) from the Host Mirror
      id: host_checkout
      if: ${{ steps.runner_caches.outputs.host != '' }}
      continue-on-error: true
      run: |
        set -euo pipefail
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        mirror="$ENACT_GIT_MIRROR"
        target_sha="$GITHUB_SHA"
        scored_control=0
        if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${ENACT_CONTROL_PIN_REQUIRED:-}" = "true" ]; then
            scored_control=1
        fi
        if [ -n "${ENACT_CONTROL_CHECKOUT_SHA:-}" ]; then
            if [ "$scored_control" -ne 1 ]; then
                echo "::error::control_checkout_sha override is refused outside scored-control workflow_dispatch (control_pin_required=true)" >&2
                exit 1
            fi
            case "$ENACT_CONTROL_CHECKOUT_SHA" in
                *[!0-9a-fA-F]*)
                    echo "::error::ENACT_CONTROL_CHECKOUT_SHA must be 40-char hex, got '$ENACT_CONTROL_CHECKOUT_SHA'" >&2
                    exit 1
                    ;;
            esac
            if [ "${#ENACT_CONTROL_CHECKOUT_SHA}" -ne 40 ]; then
                echo "::error::ENACT_CONTROL_CHECKOUT_SHA must be 40-char hex, got '$ENACT_CONTROL_CHECKOUT_SHA'" >&2
                exit 1
            fi
            target_sha="$ENACT_CONTROL_CHECKOUT_SHA"
        elif [ "$scored_control" -eq 1 ]; then
            echo "::error::scored-control dispatch requires non-empty control_checkout_sha" >&2
            exit 1
        fi
        export GIT_CONFIG_COUNT=2
        export GIT_CONFIG_KEY_0=safe.directory
        export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
        export GIT_CONFIG_KEY_1=safe.directory
        export GIT_CONFIG_VALUE_1="$mirror"
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENACT_GIT_TOKEN" | base64 | tr -d '\n')"
        base_ref="${GITHUB_BASE_REF:-${ENACT_BASE_REF:-}}"
        depth="${ENACT_HOST_FETCH_DEPTH:-50}"
        fetch_args=(--no-tags)
        if [ "$depth" != "0" ]; then
            fetch_args+=("--depth=$depth")
        fi
        refs=()
        case "${GITHUB_REF:-}" in
            refs/heads/*|refs/pull/*|refs/tags/*) refs+=("+$GITHUB_REF:$GITHUB_REF") ;;
        esac
        if [ -n "$base_ref" ] && [ "refs/heads/$base_ref" != "${GITHUB_REF:-}" ]; then
            refs+=("+refs/heads/$base_ref:refs/heads/$base_ref")
        fi
        (
            flock 9
            if [ ! -f "$mirror/HEAD" ]; then
                git init -q --bare "$mirror"
                git -C "$mirror" config uploadpack.allowAnySHA1InWant true
                git -C "$mirror" config gc.auto 0
            fi
            ref_current=""
            case "${GITHUB_REF:-}" in
                refs/heads/*|refs/pull/*|refs/tags/*) ref_current=$(git -C "$mirror" rev-parse --verify -q "$GITHUB_REF^{commit}" 2>/dev/null || true) ;;
                *) ref_current="$target_sha" ;;
            esac
            base_missing=0
            if [ -n "$base_ref" ] && ! git -C "$mirror" rev-parse --verify -q "refs/heads/$base_ref^{commit}" >/dev/null 2>&1; then
                base_missing=1
            fi
            if [ -z "$(find "$mirror/HEAD" -mmin -1 2>/dev/null || true)" ] || [ "$ref_current" != "$target_sha" ] || [ "$base_missing" = 1 ] || ! git -C "$mirror" cat-file -e "$target_sha^{commit}" 2>/dev/null; then
                if [ "${#refs[@]}" -gt 0 ]; then
                    git -C "$mirror" -c "http.extraheader=$header" fetch -q "${fetch_args[@]}" "$url" "${refs[@]}" \
                        || git -C "$mirror" -c "http.extraheader=$header" fetch -q "${fetch_args[@]}" "$url" "$target_sha"
                else
                    git -C "$mirror" -c "http.extraheader=$header" fetch -q "${fetch_args[@]}" "$url" "$target_sha"
                fi
                if ! git -C "$mirror" cat-file -e "$target_sha^{commit}" 2>/dev/null; then
                    git -C "$mirror" -c "http.extraheader=$header" fetch -q "${fetch_args[@]}" "$url" "$target_sha"
                fi
            fi
            touch "$mirror" "$mirror/HEAD" 2>/dev/null || true
        ) 9>"$mirror.lock"
        cd "$GITHUB_WORKSPACE"
        trap 'rm -rf "$GITHUB_WORKSPACE/.git"' ERR
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        echo "$mirror/objects" > .git/objects/info/alternates
        [ ! -f "$mirror/shallow" ] || cp "$mirror/shallow" .git/shallow
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local gc.auto 0
        mirror_branches=()
        case "${GITHUB_REF:-}" in
            refs/heads/*) mirror_branches+=("${GITHUB_REF#refs/heads/}") ;;
        esac
        if [ -n "$base_ref" ] && [ "refs/heads/$base_ref" != "${GITHUB_REF:-}" ]; then
            mirror_branches+=("$base_ref")
        fi
        if [ "${#mirror_branches[@]}" -gt 0 ]; then
            for ref_branch in "${mirror_branches[@]}"; do
                ref_sha=$(git -C "$mirror" rev-parse --verify -q "refs/heads/$ref_branch^{commit}" 2>/dev/null || true)
                if [ -n "$ref_sha" ]; then
                    git update-ref "refs/remotes/origin/$ref_branch" "$ref_sha"
                fi
            done
        fi
        if [ -n "${ENACT_SPARSE_CONE:-}" ]; then
            raw_cone=()
            while IFS= read -r entry; do
                entry="${entry#"${entry%%[![:space:]]*}"}"
                entry="${entry%"${entry##*[![:space:]]}"}"
                [ -n "$entry" ] && raw_cone+=("$entry")
            done <<<"$ENACT_SPARSE_CONE"
            cone=()
            to_check=()
            if [ "${#raw_cone[@]}" -gt 0 ]; then
                for entry in "${raw_cone[@]}"; do
                    case "$entry" in
                        */.enact-direct-files)
                            cone+=("$entry")
                            ;;
                        *)
                            to_check+=("$entry")
                            ;;
                    esac
                done
            fi
            if [ "${#to_check[@]}" -gt 0 ]; then
                idx=0
                while IFS= read -r kind; do
                    entry="${to_check[$idx]}"
                    idx=$((idx + 1))
                    if [ "$kind" = "blob" ]; then
                        case "$entry" in
                            */*) cone+=("${entry%/*}/.enact-direct-files") ;;
                        esac
                    else
                        cone+=("$entry")
                    fi
                done < <(
                    for entry in "${to_check[@]}"; do
                        printf '%s:%s\n' "${target_sha:-$GITHUB_SHA}" "$entry"
                    done | git cat-file --batch-check='%(objecttype)'
                )
            fi
            if [ "${#cone[@]}" -gt 0 ]; then
                git sparse-checkout set --cone "${cone[@]}"
            fi
        fi
        if [ -n "${ENACT_CONTROL_CHECKOUT_SHA:-}" ]; then
            git checkout -q --force --detach "$target_sha"
        else
            case "${GITHUB_REF:-}" in
                refs/heads/*) git checkout -q --force -B "${GITHUB_REF#refs/heads/}" "$target_sha" ;;
                *) git checkout -q --force --detach "$target_sha" ;;
            esac
        fi
        checked_commit=$(git rev-parse HEAD)
        checked_tree=$(git rev-parse "HEAD^{tree}")
        if [ "$checked_commit" != "$target_sha" ]; then
            echo "::error::host checkout commit mismatch: expected $target_sha, got $checked_commit" >&2
            exit 1
        fi
        echo "Checked out $checked_commit (tree $checked_tree) through the host mirror"
      env:
        ENACT_CONTROL_CHECKOUT_SHA: ${{ inputs.control_checkout_sha }}
        ENACT_CONTROL_PIN_REQUIRED: ${{ inputs.control_pin_required }}
        ENACT_GIT_TOKEN: ${{ github.token }}
        ENACT_SPARSE_CONE: ${{ matrix.sparse_checkout }}
    - name: Checkout Repository (sparse)
      id: sparse_checkout
      if: ${{ matrix.sparse_checkout != '' && (steps.runner_caches.outputs.host == '' || steps.host_checkout.outcome == 'failure') }}
      run: |
        set -euo pipefail
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        target_sha="$GITHUB_SHA"
        scored_control=0
        if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${ENACT_CONTROL_PIN_REQUIRED:-}" = "true" ]; then
            scored_control=1
        fi
        if [ -n "${ENACT_CONTROL_CHECKOUT_SHA:-}" ]; then
            if [ "$scored_control" -ne 1 ]; then
                echo "::error::control_checkout_sha override is refused outside scored-control workflow_dispatch (control_pin_required=true)" >&2
                exit 1
            fi
            case "$ENACT_CONTROL_CHECKOUT_SHA" in
                *[!0-9a-fA-F]*)
                    echo "::error::ENACT_CONTROL_CHECKOUT_SHA must be 40-char hex, got '$ENACT_CONTROL_CHECKOUT_SHA'" >&2
                    exit 1
                    ;;
            esac
            if [ "${#ENACT_CONTROL_CHECKOUT_SHA}" -ne 40 ]; then
                echo "::error::ENACT_CONTROL_CHECKOUT_SHA must be 40-char hex, got '$ENACT_CONTROL_CHECKOUT_SHA'" >&2
                exit 1
            fi
            target_sha="$ENACT_CONTROL_CHECKOUT_SHA"
        elif [ "$scored_control" -eq 1 ]; then
            echo "::error::scored-control dispatch requires non-empty control_checkout_sha" >&2
            exit 1
        fi
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0=safe.directory
        export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENACT_GIT_TOKEN" | base64 | tr -d '\n')"
        cd "$GITHUB_WORKSPACE"
        # shellcheck disable=SC2015
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local protocol.version 2
        git config --local fetch.parallel 0
        git config --local checkout.workers 0
        git config --local index.threads 0
        git config --local advice.detachedHead false
        git config --local gc.auto 0
        cone=()
        while IFS= read -r entry; do
            entry="${entry#"${entry%%[![:space:]]*}"}"
            entry="${entry%"${entry##*[![:space:]]}"}"
            [ -n "$entry" ] && cone+=("$entry")
        done <<<"${ENACT_SPARSE_CONE:-}"
        depth="${ENACT_FETCH_DEPTH:-1}"
        fetch_args=(--no-tags --no-recurse-submodules)
        if [ "$depth" != "0" ]; then
            fetch_args+=("--depth=$depth")
        fi
        narrow_cone=0
        if [ "${#cone[@]}" -gt 0 ] && [ "${#cone[@]}" -le 8 ]; then
            narrow_cone=1
            for entry in "${cone[@]}"; do
                case "$entry" in
                    . | ./ | .. | ../*)
                        narrow_cone=0
                        break
                        ;;
                    .* | cue.mod | cue.mod/* | bin | bin/* | */*)
                        ;;
                    *)
                        narrow_cone=0
                        break
                        ;;
                esac
            done
        fi
        if [ "$narrow_cone" = 1 ]; then
            fetch_args+=(--filter=blob:none)
        fi
        if [ -n "${ENACT_CONTROL_CHECKOUT_SHA:-}" ]; then
            git fetch -q "${fetch_args[@]}" origin "$target_sha"
        else
            git fetch -q "${fetch_args[@]}" origin "$target_sha" 2>/dev/null \
                || git fetch -q "${fetch_args[@]}" origin "$GITHUB_REF"
        fi
        if [ "${#cone[@]}" -gt 0 ]; then
            normalized=()
            for entry in "${cone[@]}"; do
                case "$entry" in
                    */.enact-direct-files)
                        normalized+=("$entry")
                        ;;
                    *)
                        kind=$(git cat-file -t "$target_sha:$entry" 2>/dev/null || true)
                        if [ "$kind" = "blob" ]; then
                            case "$entry" in
                                */*) normalized+=("${entry%/*}/.enact-direct-files") ;;
                            esac
                        else
                            normalized+=("$entry")
                        fi
                        ;;
                esac
            done
            if [ "${#normalized[@]}" -gt 0 ]; then
                git sparse-checkout set --cone "${normalized[@]}"
            fi
        fi
        if [ -n "${ENACT_CONTROL_CHECKOUT_SHA:-}" ]; then
            git checkout -q --force --detach "$target_sha"
        else
            case "$GITHUB_REF" in
                refs/heads/*) git checkout -q --force -B "${GITHUB_REF#refs/heads/}" "$target_sha" ;;
                *) git checkout -q --force --detach "$target_sha" ;;
            esac
        fi
        checked_commit=$(git rev-parse HEAD)
        checked_tree=$(git rev-parse "HEAD^{tree}")
        if [ "$checked_commit" != "$target_sha" ]; then
            echo "::error::shallow sparse checkout commit mismatch: expected $target_sha, got $checked_commit" >&2
            exit 1
        fi
        echo "Checked out $checked_commit (tree $checked_tree) (shallow sparse)"
      env:
        ENACT_CONTROL_CHECKOUT_SHA: ${{ inputs.control_checkout_sha }}
        ENACT_CONTROL_PIN_REQUIRED: ${{ inputs.control_pin_required }}
        ENACT_FETCH_DEPTH: "1"
        ENACT_GIT_TOKEN: ${{ github.token }}
        ENACT_SPARSE_CONE: ${{ matrix.sparse_checkout }}
    - name: Checkout Repository (full)
      if: ${{ matrix.sparse_checkout == '' && (steps.runner_caches.outputs.host == '' || steps.host_checkout.outcome == 'failure') }}
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.control_pin_required == 'true') && inputs.control_checkout_sha || '' }}
        show-progress: "false"
        submodules: "false"
    - name: Install committed enact & enve builds
      run: |
        P="$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/^darwin$/macos/')-$(uname -m | sed 's/^arm64$/aarch64/')"
        E="${GITHUB_WORKSPACE:-$PWD}/bin/$P/enact"
        [ -f "$E" ] || E="${GITHUB_WORKSPACE:-$PWD}/bin/enact"
        [ -f "$E" ] || E="$(command -v enact || echo "$HOME/.cargo/bin/enact")"
        chmod +x "$E" 2>/dev/null || true
        "$E" --version >/dev/null 2>&1 || { echo "::error title=No enact for $P::$E does not run on this $P runner; commit its build as bin/$P/enact"; exit 1; }
        "$E" ci install-binaries
    - name: Look Up Built Outputs in the Host Cache
      id: outputs-host-lookup
      if: ${{ steps.runner_caches.outputs.host != '' && matrix.output_key != '' }}
      continue-on-error: true
      run: enact ci host-outputs lookup
      env:
        ENACT_OUTPUTS_KEY: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_key }}
        ENACT_OUTPUTS_PATHS: ${{ matrix.output_paths }}
    - name: Look Up Built Outputs in the Remote Cache
      id: outputs-remote-lookup
      if: ${{ steps.outputs-host-lookup.outputs.cache-hit != 'true' && matrix.output_key != '' }}
      continue-on-error: true
      run: enact ci host-outputs remote-lookup
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID || env.R2_READ_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY || env.R2_READ_SECRET_ACCESS_KEY }}
        ENACT_CACHE_WRITE: read_only
        ENACT_OUTPUTS_KEY: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_key }}
        ENACT_OUTPUTS_PATHS: ${{ matrix.output_paths }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
    - name: Look Up Built Outputs
      id: outputs-lookup
      if: ${{ matrix.output_key != '' }}
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_key }}
        lookup-only: "true"
        path: ${{ matrix.output_paths }}
    - name: Skip on Built Outputs Found
      id: skip
      if: ${{ matrix.output_key != '' }}
      run: "[ \"$HIT\" != true ] || echo hit=true >> \"$GITHUB_OUTPUT\""
      env:
        HIT: ${{ steps.outputs-host-lookup.outputs.cache-hit == 'true' || steps.outputs-remote-lookup.outputs.cache-hit == 'true' || (!(github.event_name == 'workflow_dispatch' && inputs.seed_caches == 'true' && github.ref_name == github.event.repository.default_branch) && steps.outputs-lookup.outputs.cache-hit == 'true') }}
    - name: Ensure enve & enact CLI on PATH
      id: setup-runner
      if: ${{ !steps.skip.outputs.hit }}
      run: enact ci setup-runner
    - name: Recover Built Outputs with the Installed CLI
      id: outputs-host-recover
      if: ${{ success() && steps.runner_caches.outputs.host != '' && !steps.skip.outputs.hit && matrix.output_key != '' }}
      continue-on-error: true
      run: enact ci host-outputs restore-build
      env:
        ENACT_OUTPUTS_KEY: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_key }}
        ENACT_OUTPUTS_PATHS: ${{ matrix.output_paths }}
    - name: Restore history Handoff
      id: history-host
      if: ${{ (env.ENACT_HOST_CACHE != '') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      continue-on-error: true
      run: enact ci handoff history --artifact "$ENACT_HANDOFF_ARTIFACT" --directory "$RUNNER_TEMP/enact-history-input"
      env:
        ENACT_HANDOFF_ARTIFACT: ${{ inputs.history_input_artifact }}
        GH_TOKEN: ${{ github.token }}
    - name: Download the Selected CI History
      if: ${{ (steps.history-host.outputs.ready != 'true') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.history_input_artifact }}
        path: ${{ runner.temp }}/enact-history-input
    - name: Import the Selected CI History
      if: ${{ !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      run: |-
        export ENACT_HISTORY_DIR="$RUNNER_TEMP/enact-history"
        printf 'ENACT_HISTORY_DIR=%s\n' "$ENACT_HISTORY_DIR" >> "$GITHUB_ENV"
        enact ci history import --input "$RUNNER_TEMP/enact-history-input/snapshot.json" --manifest "$RUNNER_TEMP/enact-history-input/snapshot.manifest.json" --output "$ENACT_HISTORY_DIR"
    - name: Cache history Handoff on the Receiving Host
      if: ${{ (env.ENACT_HOST_CACHE != '' && steps.history-host.outputs.ready != 'true') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      continue-on-error: true
      run: enact ci handoff history --publish --artifact "$ENACT_HANDOFF_ARTIFACT" --directory "$RUNNER_TEMP/enact-history-input"
      env:
        ENACT_HANDOFF_ARTIFACT: ${{ inputs.history_input_artifact }}
    - name: Write the Build Outputs Producers
      if: ${{ (toJson(matrix.output_keys) != 'null') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      run: |-
        cat > "$ENACT_OUTPUTS_PRODUCERS_FILE" <<'PRODUCERS_JSON'
        {"e2e--build":{"job":"e2e:build","paths":"bin/grafana\npublic/build\npublic/build-swagger\npublic/app/plugins/datasource/*/dist\ne2e-playwright/test-plugins/*/dist\ndata/plugins-bundled\n.enact/state/outputs/e2e--build.key\n.enact/state/outputs/e2e--build.manifest-v1.json"}}
        PRODUCERS_JSON
      env:
        ENACT_OUTPUTS_PRODUCERS_FILE: ${{ runner.temp }}/enact-outputs-producers.json
    - name: Restore Built Outputs from the Host Cache
      id: outputs-host
      if: ${{ (steps.runner_caches.outputs.host != '' && toJson(matrix.output_keys) != 'null') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      continue-on-error: true
      run: enact ci host-outputs restore
      env:
        ENACT_OUTPUTS_NEEDED: ${{ toJson(matrix.output_keys) }}
        ENACT_OUTPUTS_PLATFORM: ${{ runner.os }}-${{ runner.arch }}
        ENACT_OUTPUTS_PRODUCERS_FILE: ${{ runner.temp }}/enact-outputs-producers.json
    - name: Restore Built Outputs from the Remote Cache
      id: outputs-remote
      if: ${{ (toJson(matrix.output_keys) != 'null') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      continue-on-error: true
      run: enact ci host-outputs remote-restore
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID || env.R2_READ_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY || env.R2_READ_SECRET_ACCESS_KEY }}
        ENACT_CACHE_WRITE: read_only
        ENACT_OUTPUTS_NEEDED: ${{ toJson(matrix.output_keys) }}
        ENACT_OUTPUTS_PLATFORM: ${{ runner.os }}-${{ runner.arch }}
        ENACT_OUTPUTS_PRODUCERS_FILE: ${{ runner.temp }}/enact-outputs-producers.json
        ENACT_OUTPUTS_STEPS: ${{ toJson(steps) }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
    - name: Restore Built Outputs (e2e:build)
      id: outputs-e2e--build
      if: ${{ (matrix.output_keys['e2e--build'] != '' && steps.outputs-host.outputs['e2e--build'] != 'true' && steps.outputs-remote.outputs['e2e--build'] != 'true') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: enact-outputs-e2e--build-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_keys['e2e--build'] }}
        path: |-
          bin/grafana
          public/build
          public/build-swagger
          public/app/plugins/datasource/*/dist
          e2e-playwright/test-plugins/*/dist
          data/plugins-bundled
          .enact/state/outputs/e2e--build.key
          .enact/state/outputs/e2e--build.manifest-v1.json
    - name: Restore Built Outputs Artifact (e2e:build)
      id: outputs-artifact-e2e--build
      if: ${{ (matrix.output_keys['e2e--build'] != '' && steps.outputs-host.outputs['e2e--build'] != 'true' && steps.outputs-remote.outputs['e2e--build'] != 'true' && steps.outputs-e2e--build.outputs.cache-hit != 'true') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: enact-outputs-e2e--build-${{ runner.os }}-${{ runner.arch }}
        path: '.'
    - name: Require Built Outputs
      if: ${{ (toJson(matrix.output_keys) != 'null') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      run: enact ci host-outputs require
      env:
        ENACT_OUTPUTS_NEEDED: ${{ toJson(matrix.output_keys) }}
        ENACT_OUTPUTS_PLATFORM: ${{ runner.os }}-${{ runner.arch }}
        ENACT_OUTPUTS_PRODUCERS_FILE: ${{ runner.temp }}/enact-outputs-producers.json
        ENACT_OUTPUTS_STEPS: ${{ toJson(steps) }}
    - parallel:
      - name: Restore Python build & venv cache
        id: python_l1_cache
        if: ${{ (contains(matrix.technology, 'python') && steps.runner_caches.outputs.host == '' && hashFiles('uv.lock', 'pyproject.toml', 'requirements.txt', 'poetry.lock', 'enve.lock') != '') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-python-v2-${{ hashFiles('uv.lock', 'pyproject.toml', 'requirements.txt', 'poetry.lock', 'enve.lock') }}
          path: |-
            /tmp/.cache/uv
            /tmp/.cache/pip
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-python-v2-
      - name: Restore Go build cache
        id: go_l1_cache
        if: ${{ (contains(matrix.technology, 'go') && steps.runner_caches.outputs.host == '' && hashFiles('**/go.mod', '**/go.sum') != '') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.mod', '**/go.sum') }}-${{ github.sha }}
          path: |-
            /tmp/go-build
            /tmp/go/pkg/mod
          restore-keys: |-
            ${{ runner.os }}-${{ runner.arch }}-go-seed-${{ hashFiles('go.mod', 'go.sum', 'go.work', 'go.work.sum', 'enve.lock') }}
            ${{ runner.os }}-${{ runner.arch }}-go-seed-
            ${{ runner.os }}-go-${{ hashFiles('**/go.mod', '**/go.sum') }}-
            ${{ runner.os }}-go-
      - name: Restore Node dependency cache
        id: node_l1_cache
        if: ${{ ((contains(matrix.technology, 'typescript') || contains(matrix.technology, 'javascript') || contains(matrix.technology, 'node')) && steps.runner_caches.outputs.host == '') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-node-v4-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'enve.lock', 'pnpm-workspace.yaml') }}
          path: |-
            .enact/state/pnpm-store
            .enact/state/pnpm-cache
            node_modules/.cache
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node-v4-
    - name: Record Restored Package Caches
      if: ${{ ((steps.runner_caches.outputs.host == '' && steps.python_l1_cache.outputs.cache-hit != 'true' || steps.runner_caches.outputs.host == '' && steps.node_l1_cache.outputs.cache-hit != 'true') && github.event_name != 'pull_request') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      continue-on-error: true
      run: enact ci cache-delta record
      env:
        ENACT_CACHE_DELTA: |-
          python_l1_cache /tmp/.cache/uv
          python_l1_cache /tmp/.cache/pip
          node_l1_cache .enact/state/pnpm-store
          node_l1_cache .enact/state/pnpm-cache
          node_l1_cache node_modules/.cache
        ENACT_CACHE_HITS: |-
          python_l1_cache=${{ steps.python_l1_cache.outputs.cache-hit }}
          node_l1_cache=${{ steps.node_l1_cache.outputs.cache-hit }}
    - name: Restore shard-manifest Handoff
      id: shard-manifest-native
      if: ${{ (matrix.shard_manifest_digest != '' && env.ENACT_HOST_CACHE != '') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      continue-on-error: true
      run: enact ci handoff shard-manifest --artifact "$ENACT_HANDOFF_ARTIFACT" --directory "$RUNNER_TEMP/enact-shard-manifest"
      env:
        ENACT_HANDOFF_ARTIFACT: enact-shard-manifest
        GH_TOKEN: ${{ github.token }}
    - name: Download the Frozen Shard Manifest
      id: shard-manifest-download
      if: ${{ (matrix.shard_manifest_digest != '' && steps.shard-manifest-native.outputs.ready != 'true') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      uses: actions/download-artifact@v8
      with:
        name: enact-shard-manifest
        path: ${{ runner.temp }}/enact-shard-manifest
    - name: Cache shard-manifest Handoff on the Receiving Host
      if: ${{ (matrix.shard_manifest_digest != '' && env.ENACT_HOST_CACHE != '' && steps.shard-manifest-native.outputs.ready != 'true') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      continue-on-error: true
      run: enact ci handoff shard-manifest --publish --artifact "$ENACT_HANDOFF_ARTIFACT" --directory "$RUNNER_TEMP/enact-shard-manifest"
      env:
        ENACT_HANDOFF_ARTIFACT: enact-shard-manifest
    - name: Pin the Frozen Shard Manifest
      id: shard-manifest-pin
      if: ${{ (matrix.shard_manifest_digest != '') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      run: echo "ENACT_SHARD_MANIFEST=$RUNNER_TEMP/enact-shard-manifest/manifest.json" >> "$GITHUB_ENV"
    - name: Restore reach Handoff
      id: reach-native
      if: ${{ (toJSON(matrix.needs_reach) != 'false' && (env.ENACT_HOST_CACHE != '')) && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      continue-on-error: true
      run: enact ci handoff reach --artifact "$ENACT_HANDOFF_ARTIFACT" --directory "$RUNNER_TEMP/enact-reach"
      env:
        ENACT_HANDOFF_ARTIFACT: enact-reach-map
        GH_TOKEN: ${{ github.token }}
    - name: Download the Reach Map
      id: reach-download
      if: ${{ (toJSON(matrix.needs_reach) != 'false' && (steps.reach-native.outputs.ready != 'true')) && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: enact-reach-map
        path: ${{ runner.temp }}/enact-reach
    - name: Cache reach Handoff on the Receiving Host
      id: reach-verified
      if: ${{ (toJSON(matrix.needs_reach) != 'false' && (env.ENACT_HOST_CACHE != '' && steps.reach-native.outputs.ready != 'true')) && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      continue-on-error: true
      run: enact ci handoff reach --publish --artifact "$ENACT_HANDOFF_ARTIFACT" --directory "$RUNNER_TEMP/enact-reach"
      env:
        ENACT_HANDOFF_ARTIFACT: enact-reach-map
    - name: Plan with the Detected Reach Map
      id: reach-pin
      if: ${{ !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      run: |-
        if [ -n "${GITHUB_HEAD_SHA:-}" ] && [ -z "$(git rev-list -n1 --no-walk --ignore-missing --missing=allow-any "$GITHUB_HEAD_SHA" -- 2>/dev/null)" ]; then
          git fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_HEAD_SHA" 2>/dev/null
        fi
        if [ -n "${ENACT_CONTROL_CHECKOUT_SHA:-}" ]; then
          actual_head=$(git rev-parse HEAD)
          actual_tree=$(git rev-parse "HEAD^{tree}")
          if [ "$actual_head" != "$ENACT_CONTROL_CHECKOUT_SHA" ]; then
            echo "::error::worker checkout mismatch: expected $ENACT_CONTROL_CHECKOUT_SHA, got $actual_head" >&2
            exit 1
          fi
          echo "Worker checkout verified: commit=$actual_head tree=$actual_tree"
        fi
        if [ "${ENACT_CONTROL_PIN_REQUIRED:-}" = true ]; then
          ctrl_pr_head="${ENACT_CONTROL_PR_HEAD_SHA:-}"
          case "$ctrl_pr_head" in
            ""|*[!0-9a-fA-F]*)
              echo "::error::control worker requires 40-char hex ENACT_CONTROL_PR_HEAD_SHA from detect, got '$ctrl_pr_head'" >&2
              exit 1
              ;;
          esac
          if [ "${#ctrl_pr_head}" -ne 40 ]; then
            echo "::error::control worker requires 40-char hex ENACT_CONTROL_PR_HEAD_SHA from detect, got '$ctrl_pr_head'" >&2
            exit 1
          fi
          worker_parent2=$(git cat-file -p HEAD | awk '$1=="parent"{n++; if(n==2) print $2}')
          if [ -n "$worker_parent2" ] && [ "$worker_parent2" != "$ctrl_pr_head" ]; then
            echo "::error::worker merge 2nd parent '$worker_parent2' does not match detect PR head '$ctrl_pr_head'" >&2
            exit 1
          fi
          if ! git cat-file -e "${ctrl_pr_head}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$ctrl_pr_head"
          fi
          if ! git cat-file -e "${ctrl_pr_head}^{commit}" 2>/dev/null; then
            echo "::error::worker missing PR head commit '$ctrl_pr_head' locally after fetch" >&2
            exit 1
          fi
          echo "ENACT_PR_HEAD_SHA=$ctrl_pr_head" >> "$GITHUB_ENV"
          echo "GITHUB_HEAD_SHA=$ctrl_pr_head" >> "$GITHUB_ENV"
        fi
        if [ "${ENACT_NEEDS_REACH:-true}" != false ]; then
          if [ "$ENACT_HANDOFF_READY" = true ] && [ -f "$RUNNER_TEMP/enact-reach/map.bin" ] && [ -f "$RUNNER_TEMP/enact-reach/map.age.json" ]; then
            if command -v sha256sum >/dev/null 2>&1; then
              map_sha=$(sha256sum "$RUNNER_TEMP/enact-reach/map.bin" | awk '{print $1}')
              age_sha=$(sha256sum "$RUNNER_TEMP/enact-reach/map.age.json" | awk '{print $1}')
            else
              map_sha=$(shasum -a 256 "$RUNNER_TEMP/enact-reach/map.bin" | awk '{print $1}')
              age_sha=$(shasum -a 256 "$RUNNER_TEMP/enact-reach/map.age.json" | awk '{print $1}')
            fi
            echo "Handed reach map SHA-256: $map_sha age SHA-256: $age_sha"
            if [ "${ENACT_CONTROL_PIN_REQUIRED:-}" = true ]; then
              if [ -n "${ENACT_PIN_REACH_MAP_SHA256:-}" ]; then
                expected_sha=$(printf '%s' "${ENACT_PIN_REACH_MAP_SHA256#sha256:}" | tr 'A-F' 'a-f')
                if [ "$map_sha" != "$expected_sha" ]; then
                  echo "::error::handed reach map SHA-256 mismatch in worker: expected $expected_sha, got $map_sha" >&2
                  exit 1
                fi
              fi
              if [ -n "${ENACT_PIN_REACH_AGE_SHA256:-}" ]; then
                expected_age=$(printf '%s' "${ENACT_PIN_REACH_AGE_SHA256#sha256:}" | tr 'A-F' 'a-f')
                if [ "$age_sha" != "$expected_age" ]; then
                  echo "::error::handed reach age SHA-256 mismatch in worker: expected $expected_age, got $age_sha" >&2
                  exit 1
                fi
              fi
            fi
            echo "ENACT_REACH_FILE=$RUNNER_TEMP/enact-reach/map.bin" >> "$GITHUB_ENV"
          elif [ "${ENACT_CONTROL_PIN_REQUIRED:-}" = true ]; then
            echo "::error::control run worker missing handed-off reach map" >&2
            exit 1
          fi
        fi
      env:
        ENACT_CONTROL_CHECKOUT_SHA: ${{ inputs.control_checkout_sha }}
        ENACT_CONTROL_PIN_REQUIRED: ${{ inputs.control_pin_required }}
        ENACT_CONTROL_PR_HEAD_SHA: ${{ inputs.control_pr_head_sha }}
        ENACT_HANDOFF_READY: ${{ steps.reach-native.outputs.ready == 'true' || steps.reach-verified.outputs.ready == 'true' || (env.ENACT_HOST_CACHE == '' && steps.reach-download.outcome == 'success') }}
        ENACT_NEEDS_REACH: ${{ toJSON(matrix.needs_reach) }}
        ENACT_PIN_REACH_AGE_SHA256: ${{ inputs.pin_reach_age_sha256 }}
        ENACT_PIN_REACH_MAP_SHA256: ${{ inputs.pin_reach_map_sha256 }}
        GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    - name: Fetch the Revisions Selection Ages By
      if: ${{ (matrix.selects_in_job) && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      continue-on-error: true
      run: |-
        FETCH="git fetch --no-tags --depth=1 --filter=blob:none origin"
        # shellcheck disable=SC2046,SC2086 # one word per revision
        set -- $(enact reach revisions --missing 2>/dev/null || true) $ENACT_SELECT_BASE
        if [ "$#" -gt 0 ]; then
          $FETCH "$@" 2>/dev/null || for rev in "$@"; do
            $FETCH "$rev" 2>/dev/null || true
          done
        fi
      env:
        ENACT_SELECT_BASE: ${{ matrix.select_base }}
    - name: Pull Dependencies via enve
      if: ${{ !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      run: enact ci deps pull --component --remote signed
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID || env.R2_READ_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY || env.R2_READ_SECRET_ACCESS_KEY }}
        ENACT_COMPONENT_DIR: ${{ matrix.component_dir }}
        ENACT_ENVIRONMENT_FILE: ${{ matrix.environment_file || '' }}
        ENACT_JOB_SERVICES: ${{ matrix.services }}
        ENACT_PREPARE_ENVIRONMENT_FILES: ${{ toJSON(matrix.preparation_environment_files || fromJSON('[]')) }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENVE_CACHE_CONCURRENCY: "16"
    - name: Check enve Stores into the Host Cache
      if: ${{ (steps.runner_caches.outputs.host != '') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      run: enact ci check-store
    - name: Install Project Dependencies
      if: ${{ (hashFiles('package.json') != '' && (contains(matrix.technology, 'typescript') || contains(matrix.technology, 'javascript') || contains(matrix.technology, 'node'))) && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      run: enact ci deps install node --manager pnpm --filters
      env:
        ENACT_ENVIRONMENT_FILE: enve.cue
        ENACT_MATRIX_FILTER_ARGS: ${{ matrix.filter_args }}
    - name: Execute Component Task
      if: ${{ !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      run: eval "$ENACT_MATRIX_COMMAND"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID || env.R2_READ_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY || env.R2_READ_SECRET_ACCESS_KEY }}
        CI_COMPONENT: ${{ matrix.component }}
        ENACT_CACHE_WRITE: read_only
        ENACT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        ENACT_ENVIRONMENT_FILE: ${{ matrix.environment_file || '' }}
        ENACT_INPUT_FORCE_WARM_SUITES: ${{ inputs.force_warm_suites }}
        ENACT_MATRIX_COMMAND: ${{ matrix.command }}
        ENACT_MAX_PARALLEL: ${{ matrix.max_parallel }}
        ENACT_PREEMPTION_NOTICE_SEC: ${{ matrix.preemption_notice_sec }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENACT_RECORD: ${{ (github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && inputs.control_pin_required != 'true' && github.ref_name == github.event.repository.default_branch) && 'every' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != github.event.repository.default_branch) && 'auto' || 'off' }}
        ENACT_RUNNER_ALLOCATION: ${{ matrix.env.ENACT_RUNNER_ALLOCATION }}
        ENACT_RUNNER_TIER: ${{ matrix.runner_tier }}
        ENACT_SAME_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != github.event.repository.default_branch }}
        ENACT_SHARD_WEIGHTS: ${{ matrix.env.ENACT_SHARD_WEIGHTS || '' }}
        ENACT_TOPOLOGY: ${{ matrix.topology }}
    - name: Diagnose Cgroup OOM on Failure
      if: ${{ (failure()) && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      run: |-
        if [ -r /sys/fs/cgroup/memory.events ]; then
        oom=$(awk '$1 == "oom_kill" { print $2 }' /sys/fs/cgroup/memory.events 2>/dev/null || echo 0)
        peak=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo unknown)
        limit=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unknown)
        echo "cgroup memory: oom_kill=${oom:-0} peak=${peak} max=${limit}"
        if [ "${oom:-0}" -gt 0 ] 2>/dev/null; then
        echo "::error::Container cgroup OOM-killed a process (oom_kill=${oom}, memory.peak=${peak}, memory.max=${limit})"
        fi
        fi
    - name: Diagnose Disk & Btrfs Qgroup on Failure
      if: ${{ (failure()) && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      run: |-
        df -h || true
        df -i || true
        btrfs qgroup show -reF / 2>/dev/null || true
    - name: Log Cgroup Memory & PSI Telemetry
      if: ${{ (always()) && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      run: |-
        if [ -d /sys/fs/cgroup ]; then
        anon=$(awk '$1 == "anon" { print $2 }' /sys/fs/cgroup/memory.stat 2>/dev/null || echo unknown)
        kernel=$(awk '$1 == "kernel" { print $2 }' /sys/fs/cgroup/memory.stat 2>/dev/null || echo unknown)
        peak=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo unknown)
        limit=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unknown)
        high=$(awk '$1 == "high" { print $2 }' /sys/fs/cgroup/memory.events 2>/dev/null || echo 0)
        max_ev=$(awk '$1 == "max" { print $2 }' /sys/fs/cgroup/memory.events 2>/dev/null || echo 0)
        oom=$(awk '$1 == "oom_kill" { print $2 }' /sys/fs/cgroup/memory.events 2>/dev/null || echo 0)
        sampled=$(cat "${GHA_ANON_PEAK_FILE:-/dev/null}" 2>/dev/null || true)
        [ -n "$sampled" ] || sampled="nonreclaim_peak_sampled=unknown"
        psi=$(tr '\n' ' ' < /sys/fs/cgroup/memory.pressure 2>/dev/null || echo unavailable)
        echo "cgroup telemetry: anon=${anon} kernel=${kernel} peak=${peak} max=${limit} events(high=${high:-0},max=${max_ev:-0},oom_kill=${oom:-0}) ${sampled} psi=${psi}"
        fi
    - name: Push Updated Dependencies to the Remote Cache
      if: ${{ (success() && env.ENACT_REMOTE_SAVE_EVENT == 'true' && env.ENACT_HAS_SIGNING_KEY == 'true') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      continue-on-error: true
      run: enact ci deps push --signed
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_COMPONENT_DIR: ${{ matrix.component_dir }}
        ENACT_ENVIRONMENT_FILE: ${{ matrix.environment_file || '' }}
        ENACT_JOB_SERVICES: ${{ matrix.services }}
        ENACT_PREPARE_ENVIRONMENT_FILES: ${{ toJSON(matrix.preparation_environment_files || fromJSON('[]')) }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENVE_CACHE_CONCURRENCY: "16"
        ENVE_CACHE_SECRET_KEY: ${{ secrets.ENVE_CACHE_SECRET_KEY || env.ENVE_CACHE_SECRET_KEY }}
        NIX_SECRET_KEY: ${{ secrets.NIX_SECRET_KEY || env.NIX_SECRET_KEY }}
    - name: Upload Telemetry [telemetry-${{ matrix.task_id }}]
      if: ${{ (always()) && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: telemetry-${{ matrix.task_id }}
        path: |-
          .enact/state/telemetry.json
          .enact/state/summary.html
          .enact/state/runs/*/services/*.log
          .enact/state/diagnostics/grafana-e2e/*/results/**
          .enact/state/diagnostics/grafana-e2e/*/grafana-server.log
        retention-days: "1"
    - name: Upload Recorded Footprints
      if: ${{ (success() && (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != github.event.repository.default_branch || github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && inputs.control_pin_required != 'true' && github.ref_name == github.event.repository.default_branch)) && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: enact-footprints-${{ matrix.task_id }}
        path: .enact/state/cache/trace-reach.d/
        retention-days: "1"
    - name: Check Package Caches for New Entries
      id: cache_delta
      if: ${{ (!cancelled() && (steps.runner_caches.outputs.host == '' && steps.python_l1_cache.outputs.cache-hit != 'true' || steps.runner_caches.outputs.host == '' && steps.node_l1_cache.outputs.cache-hit != 'true') && env.ENACT_SAVE_EVENT == 'true' && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1') && github.event_name != 'pull_request') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      continue-on-error: true
      run: enact ci cache-delta check
      env:
        ENACT_CACHE_DELTA: |-
          python_l1_cache /tmp/.cache/uv
          python_l1_cache /tmp/.cache/pip
          node_l1_cache .enact/state/pnpm-store
          node_l1_cache .enact/state/pnpm-cache
          node_l1_cache node_modules/.cache
        ENACT_CACHE_HITS: |-
          python_l1_cache=${{ steps.python_l1_cache.outputs.cache-hit }}
          node_l1_cache=${{ steps.node_l1_cache.outputs.cache-hit }}
        ENACT_UV_PRUNE: ${{ contains(matrix.technology, 'python') && steps.python_l1_cache.outputs.cache-hit != 'true' }}
    - name: Save Python build & venv cache
      if: ${{ ((env.ENACT_SAVE_EVENT == 'true' && contains(matrix.technology, 'python') && steps.runner_caches.outputs.host == '' && hashFiles('uv.lock', 'pyproject.toml', 'requirements.txt', 'poetry.lock', 'enve.lock') != '' && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1') && steps.cache_delta.outputs.python_l1_cache == 'true') && github.event_name != 'pull_request' && steps.python_l1_cache.outputs.cache-hit != 'true') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.python_l1_cache.outputs.cache-primary-key }}
        path: |-
          /tmp/.cache/uv
          /tmp/.cache/pip
    - parallel:
      - name: Save Go build cache
        if: ${{ (((env.ENACT_SAVE_EVENT == 'true' && contains(matrix.technology, 'go') && steps.runner_caches.outputs.host == '' && hashFiles('**/go.mod', '**/go.sum') != '' && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.go_l1_cache.outputs.cache-matched-key, format('{0}-go-{1}-', runner.os, hashFiles('**/go.mod', '**/go.sum'))))) && github.event_name != 'pull_request' && steps.go_l1_cache.outputs.cache-hit != 'true') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.go_l1_cache.outputs.cache-primary-key }}
          path: |-
            /tmp/go-build
            /tmp/go/pkg/mod
    - name: Save Built Outputs to the Host Cache
      if: ${{ success() && steps.runner_caches.outputs.host != '' && !steps.skip.outputs.hit && matrix.output_key != '' }}
      continue-on-error: true
      run: enact ci host-outputs save
      env:
        ENACT_OUTPUTS_KEY: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_key }}
        ENACT_OUTPUTS_PATHS: ${{ matrix.output_paths }}
    - name: Copy Host-Cached Outputs for GitHub's Cache
      id: outputs-publish
      if: ${{ success() && steps.outputs-host-lookup.outputs.cache-hit == 'true' && (steps.outputs-lookup.outputs.cache-hit != 'true' || (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch) && steps.outputs-remote-lookup.outputs.cache-hit != 'true') && matrix.output_key != '' }}
      continue-on-error: true
      run: enact ci host-outputs restore-build
      env:
        ENACT_OUTPUTS_KEY: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_key }}
        ENACT_OUTPUTS_PATHS: ${{ matrix.output_paths }}
    - name: Cache Built Outputs
      id: cache_outputs
      if: ${{ success() && (!steps.skip.outputs.hit || steps.outputs-publish.outputs.cache-hit == 'true') && matrix.output_key != '' }}
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        key: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_key }}
        path: ${{ matrix.output_paths }}
    - name: Verify Built Outputs Cached
      id: outputs_cached
      if: ${{ success() && (!steps.skip.outputs.hit || steps.outputs-publish.outputs.cache-hit == 'true') && steps.cache_outputs.outcome == 'success' && matrix.output_key != '' }}
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_key }}
        lookup-only: "true"
        path: ${{ matrix.output_paths }}
    - name: Upload Built Outputs Artifact
      if: ${{ success() && (!steps.skip.outputs.hit || steps.outputs-publish.outputs.cache-hit == 'true') && (steps.cache_outputs.outcome != 'success' || steps.outputs_cached.outputs.cache-hit != 'true') && matrix.output_key != '' }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: error
        include-hidden-files: "true"
        name: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}-${{ runner.arch }}
        path: ${{ matrix.output_paths }}
        retention-days: "1"
    - name: Save Built Outputs to the Remote Cache
      if: ${{ success() && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch) && steps.outputs-remote-lookup.outputs.cache-hit != 'true' && (!steps.skip.outputs.hit || steps.outputs-publish.outputs.cache-hit == 'true') && matrix.output_key != '' }}
      continue-on-error: true
      run: enact ci host-outputs remote-save
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        ENACT_OUTPUTS_KEY: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_key }}
        ENACT_OUTPUTS_PATHS: ${{ matrix.output_paths }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
