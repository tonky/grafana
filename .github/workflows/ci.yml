# Generated by enact from .enact; edit the pipeline and run `enact transpile`.
name: grafana
on:
  push:
    branches:
    - main
    - perf/ci-showcase
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      all:
        description: Force execution of all components regardless of git changes
        required: false
        default: "false"
      base_ref:
        description: Target base branch for diff detection (e.g. main, master, a release branch)
        required: false
      files:
        description: File(s) to plan as changed instead of the git diff, comma-separated (e.g. one test file)
        required: false
      no_cache:
        description: Disable task cache, forcing full execution
        required: false
        default: "false"
      updated:
        description: Component(s) to emulate as updated
        required: false
      warm_reach:
        description: Run every suite and record each test without a fresh reach footprint (on the default branch, after an enact upgrade)
        required: false
        default: "false"
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  ENVE_SERVICE_GID: "1000"
  ENVE_SERVICE_UID: "1000"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GOCACHE: /tmp/go-build
  GOPATH: /tmp/go
  UV_CACHE_DIR: ${{ vars.ENACT_UV_CACHE_DIR || '/tmp/.cache/uv' }}
  XDG_CACHE_HOME: /tmp/.cache
jobs:
  build-outputs:
    name: Build Outputs (${{ matrix.component }})
    needs:
    - detect
    if: ${{ needs.detect.outputs.builds != '{"include":[]}' && needs.detect.outputs.builds != '[]' && needs.detect.outputs.builds != '' }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJson(needs.detect.outputs.builds) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    steps:
    - name: Look Up Built Outputs
      id: outputs-lookup
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_key }}
        lookup-only: "true"
        path: ${{ matrix.output_paths }}
    - name: Checkout Repository (sparse)
      if: ${{ (matrix.sparse_checkout != '') && steps.outputs-lookup.outputs.cache-hit != 'true' }}
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        sparse-checkout: ${{ matrix.sparse_checkout }}
        sparse-checkout-cone-mode: "true"
        submodules: "false"
    - name: Checkout Repository (full)
      if: ${{ (matrix.sparse_checkout == '') && steps.outputs-lookup.outputs.cache-hit != 'true' }}
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        submodules: "false"
    - name: Install committed enact & enve builds
      if: ${{ steps.outputs-lookup.outputs.cache-hit != 'true' }}
      run: |
        # The repository's committed enact, enve and bubblewrap builds: bin/<os>-<arch>/ for this runner
        # (bin/linux-x86_64/, bin/linux-aarch64/), else bin/. They're copied to ~/.cargo/bin,
        # which goes ahead of bin/ on PATH, so the runner's own build wins over bin/'s. A build for
        # another CPU (an x86_64 enve on an arm64 runner) is never installed: enact or enve fails
        # here, naming the directory to commit, instead of the first step that runs it.
        BIN_DIR="${GITHUB_WORKSPACE:-$PWD}/bin"
        PLATFORM="$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/^darwin$/macos/')-$(uname -m | sed 's/^arm64$/aarch64/')"
        # Whether this runner can execute $1: false only for an ELF of another CPU or OS.
        runs_here() {
          local header
          header="$(od -An -tx1 -N20 "$1" 2>/dev/null | tr -d ' \n')"
          [ "${header:0:8}" = 7f454c46 ] || return 0
          case "$PLATFORM:${header:36:4}" in
            linux-x86_64:3e00 | linux-aarch64:b700) return 0 ;;
          esac
          return 1
        }
        mkdir -p "$HOME/.cargo/bin"
        if [ -d "$BIN_DIR" ]; then
          for b in enact enve bwrap; do
            src="$BIN_DIR/$b"
            if [ -f "$BIN_DIR/$PLATFORM/$b" ]; then
              src="$BIN_DIR/$PLATFORM/$b"
            fi
            [ -f "$src" ] || continue
            if ! runs_here "$src"; then
              if [ "$b" = bwrap ]; then
                echo "::warning::bin/$b is a build for another CPU than this $PLATFORM runner: not installed"
                continue
              fi
              echo "::error title=No $b for $PLATFORM::bin/$b is a build for another CPU; commit this runner's as bin/$PLATFORM/$b"
              exit 1
            fi
            chmod +x "$src" 2>/dev/null || true
            cp -f "$src" "$HOME/.cargo/bin/$b"
          done
          echo "$BIN_DIR" >> "$GITHUB_PATH"
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Ensure enve & enact CLI on PATH
      if: ${{ steps.outputs-lookup.outputs.cache-hit != 'true' }}
      run: |
        git config --global --add safe.directory "*" 2>/dev/null || true
        mkdir -p "$HOME/.local/share/enve/store"
        if command -v sudo >/dev/null 2>&1; then
          sudo mkdir -p -m 0755 /nix 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" /nix 2>/dev/null || true
        fi
        if [ -d "/nix" ]; then
          if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
            cp -rn /nix/store/* "$HOME/.local/share/enve/store/" 2>/dev/null || true
            rm -rf /nix/store 2>/dev/null || true
          fi
          ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
        fi
        # The previous step's $GITHUB_PATH entries apply from the next step on.
        export PATH="$HOME/.cargo/bin:${GITHUB_WORKSPACE:-$PWD}/bin:$PATH"
        # Isolation as on a Linux workstation: with bubblewrap on PATH (e.g. the repository's
        # bin/bwrap), enve sandboxes commands and services and maps the profile's hosts inside.
        # GitHub's Ubuntu runners restrict unprivileged user namespaces (AppArmor), which bwrap
        # needs; the VM is disposable, so lift that. Without a working bwrap, enve runs on the host:
        # its profile's host aliases go to the runner's /etc/hosts instead.
        if command -v bwrap >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 \
          && [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        fi
        if command -v bwrap >/dev/null 2>&1 && bwrap --bind / / true 2>/dev/null; then
          echo "enve isolation: $(bwrap --version)"
        elif command -v sudo >/dev/null 2>&1 && command -v enve >/dev/null 2>&1 && [ -f enve.cue ]; then
          enve cue export -q -e profiles.dev.hosts enve.cue 2>/dev/null \
            | jq -r 'to_entries[] | "\(.value) \(.key)"' 2>/dev/null \
            | sudo tee -a /etc/hosts >/dev/null || true
        fi
    - name: Probe existing locked enve store
      id: enve_store_ready
      if: ${{ steps.outputs-lookup.outputs.cache-hit != 'true' }}
      run: |
        #!/usr/bin/env bash
        # Readiness is an offline locked runtime check, never a fabricated archive hit.
        set -euo pipefail
        ready=false
        probe() {
            ENVE_OFFLINE=1 timeout --kill-after=2s 8s enve run --locked -- true >/dev/null 2>&1
        }
        if [ -f enve.lock ] && command -v timeout >/dev/null && command -v enve >/dev/null && probe; then
            ready=true
            component="${ENACT_COMPONENT_DIR:-.}"
            if [ "$component" != . ] && [ -n "$component" ]; then
                if [ ! -d "$component" ]; then
                    ready=false
                elif [ -f "$component/enve.lock" ] && ! (cd -- "$component" && probe); then
                    ready=false
                fi
            fi
        fi
        printf 'ready=%s\n' "$ready" >> "$GITHUB_OUTPUT"
        printf 'Existing locked enve environment ready: %s\n' "$ready"
      env:
        ENACT_COMPONENT_DIR: ${{ matrix.component_dir }}
    - parallel:
      - name: Restore enact Task CAS Cache
        id: enact-tasks-cache
        if: ${{ steps.outputs-lookup.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-enact-tasks-${{ github.sha }}
          path: .enact/state/cache
          restore-keys: ${{ runner.os }}-enact-tasks-
      - name: Restore Python build & venv cache
        id: python_l1_cache
        if: ${{ (hashFiles('**/uv.lock', '**/pyproject.toml', '**/requirements.txt', '**/poetry.lock') != '' && contains(matrix.technology, 'python') && vars.ENACT_UV_CACHE_DIR == '') && steps.outputs-lookup.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-python-${{ hashFiles('**/uv.lock', '**/pyproject.toml', '**/requirements.txt', '**/poetry.lock') }}
          path: |-
            ${{ env.UV_CACHE_DIR }}
            /tmp/.cache/pip
          restore-keys: ${{ runner.os }}-python-
      - name: Restore Go build cache
        id: go_l1_cache
        if: ${{ (hashFiles('**/go.mod', '**/go.sum') != '' && contains(matrix.technology, 'go')) && steps.outputs-lookup.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.mod', '**/go.sum') }}-${{ github.sha }}
          path: |-
            /tmp/go-build
            /tmp/go/pkg/mod
          restore-keys: |-
            ${{ runner.os }}-go-${{ hashFiles('**/go.mod', '**/go.sum') }}-
            ${{ runner.os }}-go-
      - name: Restore Node dependency cache
        id: node_l1_cache
        if: ${{ (contains(matrix.technology, 'typescript') || contains(matrix.technology, 'javascript') || contains(matrix.technology, 'node')) && steps.outputs-lookup.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-node-v2-${{ matrix.task_id }}-${{ hashFiles('package.json', 'yarn.lock', 'enve.lock') }}
          path: |-
            /tmp/.cache/yarn
            ~/.yarn/berry/cache
            .yarn/cache
            node_modules/.cache
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node-v2-${{ matrix.task_id }}-
      - name: Restore enve Store (L1 GHA Cache)
        id: nix_l1_cache
        if: ${{ steps.outputs-lookup.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-enve-store-v2-${{ hashFiles('**/enve.lock') }}
          lookup-only: ${{ steps.enve_store_ready.outputs.ready == 'true' }}
          path: ~/.local/share/enve/store
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-enve-store-v2-
    - name: Download the Reach Map
      if: ${{ steps.outputs-lookup.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: enact-reach-map
        path: ${{ runner.temp }}/enact-reach
    - name: Plan with the Detected Reach Map
      if: ${{ steps.outputs-lookup.outputs.cache-hit != 'true' }}
      run: |-
        if [ -f "$RUNNER_TEMP/enact-reach/map.bin" ]; then
          echo "ENACT_REACH_FILE=$RUNNER_TEMP/enact-reach/map.bin" >> "$GITHUB_ENV"
        fi
    - name: Pull Dependencies via enve
      if: ${{ steps.outputs-lookup.outputs.cache-hit != 'true' }}
      run: |-
        if [ -d "/nix" ]; then
          if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
            cp -rn /nix/store/* "$HOME/.local/share/enve/store/" 2>/dev/null || true
            rm -rf /nix/store 2>/dev/null || true
          fi
          ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
        fi
        if [ -f "enve.lock" ]; then
          enve run --locked -- true
        fi
        if [ -n "$ENACT_COMPONENT_DIR" ] && [ "$ENACT_COMPONENT_DIR" != "." ] && [ -f "$ENACT_COMPONENT_DIR/enve.lock" ]; then
          (cd "$ENACT_COMPONENT_DIR" && enve run --locked -- true)
        fi
      env:
        ENACT_COMPONENT_DIR: ${{ matrix.component_dir }}
    - name: Install Project Dependencies
      if: ${{ (hashFiles('package.json') != '' && (contains(matrix.technology, 'typescript') || contains(matrix.technology, 'javascript') || contains(matrix.technology, 'node'))) && steps.outputs-lookup.outputs.cache-hit != 'true' }}
      run: |-
        RUN_PREFIX=""
        if command -v enve >/dev/null 2>&1 && [ -f "enve.lock" ]; then
          RUN_PREFIX="enve run --locked -- "
        fi
        echo "📦 Installing project dependencies..."
        ENACT_INSTALL_INPUTS=$(mktemp "$RUNNER_TEMP/enact-install-inputs.XXXXXX")
        sha256sum yarn.lock > "$ENACT_INSTALL_INPUTS"
        for input in package.json enve.lock; do
          if [ -f "$input" ]; then sha256sum "$input" >> "$ENACT_INSTALL_INPUTS"; fi
        done
        $RUN_PREFIX yarn install --immutable 2>/dev/null || $RUN_PREFIX yarn install --frozen-lockfile || exit $?
        sha256sum --check "$ENACT_INSTALL_INPUTS"
        rm "$ENACT_INSTALL_INPUTS"
        echo "ENACT_PREPARED=${ENACT_PREPARED:+$ENACT_PREPARED,}node" >> "$GITHUB_ENV"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Execute Component Task
      if: ${{ steps.outputs-lookup.outputs.cache-hit != 'true' }}
      run: eval "$ENACT_MATRIX_COMMAND"
      env:
        CI_COMPONENT: ${{ matrix.component }}
        ENACT_MATRIX_COMMAND: ${{ matrix.command }}
        ENACT_MAX_PARALLEL: ${{ matrix.max_parallel }}
        ENACT_PREEMPTION_NOTICE_SEC: ${{ matrix.preemption_notice_sec }}
        ENACT_RECORD: ${{ (github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch) && 'every' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) && 'auto' || 'off' }}
        ENACT_RUNNER_TIER: ${{ matrix.runner_tier }}
        ENACT_TOPOLOGY: ${{ matrix.topology }}
    - name: Upload Execution Telemetry & Workflow Dashboard
      if: ${{ (always()) && steps.outputs-lookup.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: telemetry-${{ matrix.task_id }}
        path: |-
          .enact/state/telemetry.json
          .enact/state/summary.html
          .enact/state/runs/*/services/*.log
        retention-days: "1"
    - name: Upload Recorded Footprints
      if: ${{ (always() && (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch)) && steps.outputs-lookup.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: enact-footprints-${{ matrix.task_id }}
        path: .enact/state/cache/trace-reach.d/
        retention-days: "1"
    - name: Save Python build & venv cache
      if: ${{ (((github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && hashFiles('**/uv.lock', '**/pyproject.toml', '**/requirements.txt', '**/poetry.lock') != '' && contains(matrix.technology, 'python') && vars.ENACT_UV_CACHE_DIR == '' && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && steps.python_l1_cache.outputs.cache-hit != 'true') && steps.outputs-lookup.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.python_l1_cache.outputs.cache-primary-key }}
        path: |-
          ${{ env.UV_CACHE_DIR }}
          /tmp/.cache/pip
    - parallel:
      - name: Save Go build cache
        if: ${{ ((((github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && hashFiles('**/go.mod', '**/go.sum') != '' && contains(matrix.technology, 'go') && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.go_l1_cache.outputs.cache-matched-key, format('{0}-go-{1}-', runner.os, hashFiles('**/go.mod', '**/go.sum'))))) && steps.go_l1_cache.outputs.cache-hit != 'true') && steps.outputs-lookup.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.go_l1_cache.outputs.cache-primary-key }}
          path: |-
            /tmp/go-build
            /tmp/go/pkg/mod
      - name: Save enve Store (L1 GHA Cache)
        if: ${{ ((steps.enve_store_ready.outputs.ready != 'true' && ((github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1'))) && steps.nix_l1_cache.outputs.cache-hit != 'true') && steps.outputs-lookup.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.nix_l1_cache.outputs.cache-primary-key }}
          path: ~/.local/share/enve/store
    - name: Cache Built Outputs
      if: ${{ success() && steps.outputs-lookup.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        key: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_key }}
        path: ${{ matrix.output_paths }}
  detect:
    name: Detect Affected Components
    runs-on:
    - self-hosted
    - Linux
    - X64
    - tonky-ci
    timeout-minutes: 5
    outputs:
      builds: ${{ steps.diff.outputs.builds }}
      built: ${{ steps.diff.outputs.built }}
      matrix: ${{ steps.diff.outputs.matrix }}
    steps:
    - name: Checkout Repository (sparse)
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        sparse-checkout: |-
          .enact
          cue.mod
          .github
          bin
          enve.cue
          enve.lock
          helpers
          public/app/plugins/datasource/azuremonitor
          public/app/plugins/datasource/grafana-testdata-datasource
          public/app/plugins/datasource/graphite
          packages/grafana-alerting
          packages/grafana-api-clients
          packages/grafana-data
          packages/grafana-e2e-selectors
          packages/grafana-eslint-rules
          packages/grafana-flamegraph
          packages/grafana-i18n
          packages/grafana-o11y-ds-frontend
          packages/grafana-openapi
          packages/grafana-plugin-compat
          packages/grafana-runtime
          packages/grafana-sql
          packages/grafana-test-utils
          packages/grafana-ui
          pkg
          apps
          kinds
          conf
          emails
          public/emails
          public/views
          public/dashboards
          public/app/plugins
          public/api-enterprise-spec.json
          public/api-merged.json
          packages/grafana-schema/src
          devenv
        sparse-checkout-cone-mode: "true"
        submodules: "false"
    - name: Restore enact Task CAS Cache
      id: enact-tasks-cache
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: ${{ runner.os }}-enact-tasks-${{ github.sha }}
        path: .enact/state/cache
        restore-keys: ${{ runner.os }}-enact-tasks-
    - name: Restore Reach Store
      id: reach-store
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: enact-reach-${{ github.ref_name }}-${{ github.sha }}
        path: .git/enact/reach
        restore-keys: |-
          enact-reach-${{ github.ref_name }}-
          enact-reach-${{ github.base_ref || github.event.repository.default_branch }}-
    - name: Install committed enact & enve builds
      run: |
        # The repository's committed enact, enve and bubblewrap builds: bin/<os>-<arch>/ for this runner
        # (bin/linux-x86_64/, bin/linux-aarch64/), else bin/. They're copied to ~/.cargo/bin,
        # which goes ahead of bin/ on PATH, so the runner's own build wins over bin/'s. A build for
        # another CPU (an x86_64 enve on an arm64 runner) is never installed: enact or enve fails
        # here, naming the directory to commit, instead of the first step that runs it.
        BIN_DIR="${GITHUB_WORKSPACE:-$PWD}/bin"
        PLATFORM="$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/^darwin$/macos/')-$(uname -m | sed 's/^arm64$/aarch64/')"
        # Whether this runner can execute $1: false only for an ELF of another CPU or OS.
        runs_here() {
          local header
          header="$(od -An -tx1 -N20 "$1" 2>/dev/null | tr -d ' \n')"
          [ "${header:0:8}" = 7f454c46 ] || return 0
          case "$PLATFORM:${header:36:4}" in
            linux-x86_64:3e00 | linux-aarch64:b700) return 0 ;;
          esac
          return 1
        }
        mkdir -p "$HOME/.cargo/bin"
        if [ -d "$BIN_DIR" ]; then
          for b in enact enve bwrap; do
            src="$BIN_DIR/$b"
            if [ -f "$BIN_DIR/$PLATFORM/$b" ]; then
              src="$BIN_DIR/$PLATFORM/$b"
            fi
            [ -f "$src" ] || continue
            if ! runs_here "$src"; then
              if [ "$b" = bwrap ]; then
                echo "::warning::bin/$b is a build for another CPU than this $PLATFORM runner: not installed"
                continue
              fi
              echo "::error title=No $b for $PLATFORM::bin/$b is a build for another CPU; commit this runner's as bin/$PLATFORM/$b"
              exit 1
            fi
            chmod +x "$src" 2>/dev/null || true
            cp -f "$src" "$HOME/.cargo/bin/$b"
          done
          echo "$BIN_DIR" >> "$GITHUB_PATH"
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Ensure enve & enact CLI on PATH
      run: |
        git config --global --add safe.directory "*" 2>/dev/null || true
        mkdir -p "$HOME/.local/share/enve/store"
        if command -v sudo >/dev/null 2>&1; then
          sudo mkdir -p -m 0755 /nix 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" /nix 2>/dev/null || true
        fi
        if [ -d "/nix" ]; then
          if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
            cp -rn /nix/store/* "$HOME/.local/share/enve/store/" 2>/dev/null || true
            rm -rf /nix/store 2>/dev/null || true
          fi
          ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
        fi
        # The previous step's $GITHUB_PATH entries apply from the next step on.
        export PATH="$HOME/.cargo/bin:${GITHUB_WORKSPACE:-$PWD}/bin:$PATH"
