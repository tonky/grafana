    - name: Install committed enact & enve builds
      run: |
        # The repository's committed enact, enve and bubblewrap builds: bin/<os>-<arch>/ for this runner
        # (bin/linux-x86_64/, bin/linux-aarch64/), else bin/. They're copied to ~/.cargo/bin,
        # which goes ahead of bin/ on PATH, so the runner's own build wins over bin/'s. A build for
        # another CPU (an x86_64 enve on an arm64 runner) is never installed: enact or enve fails
        # here, naming the directory to commit, instead of the first step that runs it.
        BIN_DIR="${GITHUB_WORKSPACE:-$PWD}/bin"
        PLATFORM="$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/^darwin$/macos/')-$(uname -m | sed 's/^arm64$/aarch64/')"
        # Whether this runner can execute $1: false only for an ELF of another CPU or OS.
        runs_here() {
          local header
          header="$(od -An -tx1 -N20 "$1" 2>/dev/null | tr -d ' \n')"
          [ "${header:0:8}" = 7f454c46 ] || return 0
          case "$PLATFORM:${header:36:4}" in
            linux-x86_64:3e00 | linux-aarch64:b700) return 0 ;;
          esac
          return 1
        }
        mkdir -p "$HOME/.cargo/bin"
        if [ -d "$BIN_DIR" ]; then
          for b in enact enve bwrap; do
            src="$BIN_DIR/$b"
            if [ -f "$BIN_DIR/$PLATFORM/$b" ]; then
              src="$BIN_DIR/$PLATFORM/$b"
            fi
            [ -f "$src" ] || continue
            if ! runs_here "$src"; then
              if [ "$b" = bwrap ]; then
                echo "::warning::bin/$b is a build for another CPU than this $PLATFORM runner: not installed"
                continue
              fi
              echo "::error title=No $b for $PLATFORM::bin/$b is a build for another CPU; commit this runner's as bin/$PLATFORM/$b"
              exit 1
            fi
            chmod +x "$src" 2>/dev/null || true
            cp -f "$src" "$HOME/.cargo/bin/$b"
          done
          echo "$BIN_DIR" >> "$GITHUB_PATH"
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Ensure enve & enact CLI on PATH
      run: |
        git config --global --add safe.directory "*" 2>/dev/null || true
        # The store the runner cache probe chose (a host cache's), else the user store.
        store="${ENVE_STORE_DIR:-$HOME/.local/share/enve/store}"
        mkdir -p "$store"
        if command -v sudo >/dev/null 2>&1; then
          sudo mkdir -p -m 0755 /nix 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" /nix 2>/dev/null || true
        fi
        if [ -d "/nix" ]; then
          if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
            cp -rn /nix/store/* "$store/" 2>/dev/null || true
            rm -rf /nix/store 2>/dev/null || true
          fi
          ln -sfn "$store" /nix/store 2>/dev/null || true
        fi
        # The previous step's $GITHUB_PATH entries apply from the next step on.
        export PATH="$HOME/.cargo/bin:${GITHUB_WORKSPACE:-$PWD}/bin:$PATH"
        # Isolation as on a Linux workstation: with bubblewrap on PATH (e.g. the repository's
        # bin/bwrap), enve sandboxes commands and services and maps the profile's hosts inside.
        # GitHub's Ubuntu runners restrict unprivileged user namespaces (AppArmor), which bwrap
        # needs; the VM is disposable, so lift that. Without a working bwrap, enve runs on the host:
        # its profile's host aliases go to the runner's /etc/hosts instead.
        if command -v bwrap >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 \
          && [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        fi
        if command -v bwrap >/dev/null 2>&1 && bwrap --bind / / true 2>/dev/null; then
          echo "enve isolation: $(bwrap --version)"
        elif command -v sudo >/dev/null 2>&1 && command -v enve >/dev/null 2>&1 && [ -f enve.cue ]; then
          enve cue export -q -e profiles.dev.hosts enve.cue 2>/dev/null \
            | jq -r 'to_entries[] | "\(.value) \(.key)"' 2>/dev/null \
            | sudo tee -a /etc/hosts >/dev/null || true
        fi
    - name: Download the Reach Map
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: enact-reach-map
        path: ${{ runner.temp }}/enact-reach
    - name: Plan with the Detected Reach Map
      run: |-
        if [ -n "${GITHUB_HEAD_SHA:-}" ] && [ -z "$(git rev-list -n1 --no-walk --ignore-missing --missing=allow-any "$GITHUB_HEAD_SHA" -- 2>/dev/null)" ]; then
          git fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_HEAD_SHA" 2>/dev/null || true
        fi
        if [ -f "$RUNNER_TEMP/enact-reach/map.bin" ]; then
          echo "ENACT_REACH_FILE=$RUNNER_TEMP/enact-reach/map.bin" >> "$GITHUB_ENV"
        fi
      env:
        GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    - name: Plan Stage [Preflight]
      id: stage_plan
      run: |-
        # Resolves the diff base, and leaves the planning flags of the `enact` command after this
        # script in "$@": --base, --all or --updated and --files, --no-cache.
        # Fetches carry commits and trees only, and name their refs: a bare `origin` fetches (or
        # deepens) every branch of the remote.
        FETCH="git fetch --no-tags --filter=blob:none origin"
        # Whether the clone has the revision, never fetching it: `rev-parse --verify` accepts any
        # full hash, and a partial clone's object lookups (`merge-base` too) fetch a missing commit
        # with its whole history.
        has_commit() {
          [ -n "$(git rev-list -n1 --no-walk --ignore-missing --missing=allow-any "$1" -- 2>/dev/null)" ]
        }
        BASE_REV=""
        BASE_REF="${ENACT_BASE_REF:-}"
        if [ -n "${ENACT_BASE_SHA:-}" ]; then
          has_commit "$ENACT_BASE_SHA" || $FETCH --depth=1 "$ENACT_BASE_SHA" 2>/dev/null || true
          if has_commit "$ENACT_BASE_SHA"; then
            BASE_REV="$ENACT_BASE_SHA"
          fi
        fi
        if [ -n "${GITHUB_HEAD_SHA:-}" ]; then
          has_commit "$GITHUB_HEAD_SHA" || $FETCH --depth=1 "$GITHUB_HEAD_SHA" 2>/dev/null || true
        fi
        if [ -z "$BASE_REV" ] && [ -z "$BASE_REF" ]; then
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ -n "${ENACT_EVENT_BEFORE:-}" ] && [ "${ENACT_EVENT_BEFORE:-}" != "0000000000000000000000000000000000000000" ]; then
              BASE_REF="${ENACT_EVENT_BEFORE:-}"
            else
              BASE_REF="HEAD~1"
            fi
          else
            INTEGRATION_BRANCH="${ENACT_INTEGRATION_BRANCH:-}"
            if [ -n "$INTEGRATION_BRANCH" ] && [ "$GITHUB_REF_NAME" != "$INTEGRATION_BRANCH" ] && [ "$GITHUB_REF_NAME" != "${ENACT_DEFAULT_BRANCH:-master}" ]; then
              has_commit "origin/$INTEGRATION_BRANCH" || $FETCH --depth=1 "+refs/heads/$INTEGRATION_BRANCH:refs/remotes/origin/$INTEGRATION_BRANCH" 2>/dev/null || true
              if has_commit "origin/$INTEGRATION_BRANCH"; then
                BASE_REF="$INTEGRATION_BRANCH"
              fi
            fi
            if [ -z "$BASE_REF" ]; then
              BASE_REF="${ENACT_DEFAULT_BRANCH:-master}"
            fi
          fi
        fi
        if [ -z "$BASE_REV" ] && [ -n "$BASE_REF" ]; then
          # The base fetches as a commit (a full hash) or a branch (into its remote-tracking ref),
          # one deep; a revision of HEAD's own (HEAD~1) is in HEAD's history.
          BASE_SPEC="+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          case "$BASE_REF" in
            HEAD | HEAD[~^]*) BASE_SPEC="" ;;
            *[!0-9a-f]*) ;;
            *) if [ ${#BASE_REF} -ge 40 ]; then BASE_SPEC="$BASE_REF"; fi ;;
          esac
          if [ -n "$BASE_SPEC" ] && ! has_commit "$BASE_REF" && ! has_commit "origin/$BASE_REF"; then
            $FETCH --depth=1 "$BASE_SPEC" 2>/dev/null || true
          fi
          # The base as this clone names it, if it has it.
          base_at() {
            if has_commit "$BASE_REF"; then
              echo "$BASE_REF"
            elif has_commit "origin/$BASE_REF"; then
              echo "origin/$BASE_REF"
            fi
          }
          merge_base() {
            BASE_AT=$(base_at)
            if [ -n "$BASE_AT" ]; then
              git merge-base HEAD "$BASE_AT" 2>/dev/null || true
            fi
          }
          # A shallow clone deepens HEAD and the base alone, in growing steps, until they meet;
          # unshallowing them is the last resort. They are named by commit: fetch skips a ref
          # that is already up to date, and so leaves it as shallow as it was.
          DEEPEN=$(git rev-parse HEAD)
          BASE_AT=$(base_at)
          if [ -n "$BASE_SPEC" ] && [ -n "$BASE_AT" ]; then
            DEEPEN="$DEEPEN $(git rev-parse "$BASE_AT")"
          fi
          MERGE_BASE=$(merge_base)
          for STEP in --deepen=50 --deepen=200 --deepen=1000 --unshallow; do
            if [ -n "$MERGE_BASE" ] || [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" != "true" ]; then
              break
            fi
            # shellcheck disable=SC2086 # one word per commit
            $FETCH "$STEP" $DEEPEN 2>/dev/null || true
            MERGE_BASE=$(merge_base)
          done
          BASE_REV="${MERGE_BASE:-$(base_at)}"
        fi
        if [ -z "$BASE_REV" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
          if has_commit HEAD~1; then
            BASE_REV="HEAD~1"
          fi
        fi
        # The reach map planning reads is the reach store's newest at an ancestor of HEAD: a
        # shallow clone sees too little history to find it, so the pull deepens it (commits only)
        # back to the stored maps' commits, and downloads from the remote tier when there is one.
        # A job handed detect's map (ENACT_REACH_FILE) plans with that one.
        if [ -z "${ENACT_REACH_FILE:-}" ]; then
          enact trace store pull || true
        fi
        # The reach map's footprints are aged by what changed since the revisions they were
        # traced at: fetch those the shallow clone lacks, else each ages whole. Their
        # trees only: aging diffs trees, and reads the few blobs it compares by function lazily.
        MAP_REVISIONS=$(enact trace revisions --missing 2>/dev/null || true)
        if [ -n "$MAP_REVISIONS" ]; then
          MAP_FETCH="$FETCH --depth=1"
          # shellcheck disable=SC2086 # one word per revision
          $MAP_FETCH $MAP_REVISIONS 2>/dev/null || for rev in $MAP_REVISIONS; do
            $MAP_FETCH "$rev" 2>/dev/null || true
          done
        fi
        # Pushes to the default branch and same-repo pull requests record the footprints of the
        # tests they run untraced or stale (`enact run`'s recording, off elsewhere on CI).
        if [ -z "${ENACT_RECORD:-}" ]; then
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "${GITHUB_REF_NAME:-}" = "${ENACT_DEFAULT_BRANCH:-master}" ]; then
            export ENACT_RECORD=auto
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "${GITHUB_HEAD_REF:-}" ] && [ "${GITHUB_HEAD_REF:-}" != "${ENACT_DEFAULT_BRANCH:-master}" ] && [ "${ENACT_SAME_REPO_PR:-true}" != "false" ]; then
            export ENACT_RECORD=auto
          fi
        fi
        # A warm-up (dispatched with warm_reach on the default branch) runs every suite and records
        # every test without a fresh footprint.
        WARM_REACH=""
        if [ "${ENACT_INPUT_WARM_REACH:-}" = "true" ] && [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${GITHUB_REF_NAME:-}" = "${ENACT_DEFAULT_BRANCH:-master}" ]; then
          export ENACT_RECORD=every
          WARM_REACH=1
        fi
        set --
        if [ -n "$BASE_REV" ]; then
          set -- "$@" --base "$BASE_REV"
        fi
        if [ "${ENACT_INPUT_ALL:-}" = "true" ] || [ -n "$WARM_REACH" ]; then
          set -- "$@" --all
        else
          if [ -n "${ENACT_INPUT_UPDATED:-}" ]; then
            set -- "$@" --updated "$ENACT_INPUT_UPDATED"
          fi
          # A dispatch's files plan as the change. Each must be a file of HEAD's tree (read from
          # its trees, so a sparse or blobless checkout answers too), or a typo plans nothing and
          # the run passes.
          if [ -n "${ENACT_INPUT_FILES:-}" ]; then
            OLD_IFS=$IFS
            IFS=,
            set -f
            for path in $ENACT_INPUT_FILES; do
              case "$(git ls-tree HEAD -- "$path" 2>/dev/null)" in
                *" blob "*) ;;
                *)
                  echo "::error::files input: '$path' is no file at HEAD (comma-separated paths from the repository root)"
                  exit 1
                  ;;
              esac
            done
            set +f
            IFS=$OLD_IFS
            set -- "$@" --files "$ENACT_INPUT_FILES"
          fi
        fi
        if [ "${ENACT_FORCE_NO_CACHE:-}" = "true" ]; then
          set -- "$@" --no-cache
        fi
        PLAN_ARGS=()
        for arg in "$@"; do
          if [ "$arg" != --no-cache ]; then PLAN_ARGS+=("$arg"); fi
        done
        set -- "${PLAN_ARGS[@]}"
        enact dry-run --pipeline .enact --workflow ci "$@" --stage preflight --github-output "$GITHUB_OUTPUT"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_BASE_REF: ${{ inputs.base_ref || github.base_ref || github.event.pull_request.base.ref }}
        ENACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        ENACT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'master' }}
        ENACT_EVENT_BEFORE: ${{ github.event.before }}
        ENACT_FORCE_NO_CACHE: ${{ inputs.no_cache == 'true' || vars.ENACT_NO_CACHE == 'true' || contains(github.event.pull_request.title, '[no-cache]') || contains(github.event.pull_request.body, '[no-cache]') || contains(github.event.pull_request.labels.*.name, 'no-cache') || contains(github.event.pull_request.labels.*.name, 'showcase') || startsWith(github.head_ref, 'showcase/') || startsWith(github.ref_name, 'showcase/') }}
        ENACT_INPUT_ALL: ${{ inputs.all }}
        ENACT_INPUT_FILES: ${{ inputs.files }}
        ENACT_INPUT_UPDATED: ${{ inputs.updated }}
        ENACT_INPUT_WARM_REACH: ${{ inputs.warm_reach }}
        ENACT_INTEGRATION_BRANCH: ${{ vars.ENACT_INTEGRATION_BRANCH }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENACT_SAME_REPO_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        GITHUB_HEAD_REF: ${{ github.head_ref }}
        GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    - parallel:
      - name: Restore enact Task CAS Cache
        id: enact-tasks-cache
        if: ${{ steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-enact-tasks-${{ github.sha }}
          path: .enact/state/cache
          restore-keys: ${{ runner.os }}-enact-tasks-
      - name: Restore Node dependency cache
        id: node_l1_cache
        if: ${{ (steps.runner_caches.outputs.host == '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-node-v2-stage-preflight-${{ hashFiles('package.json', 'yarn.lock', 'enve.lock') }}
          path: |-
            /tmp/.cache/yarn
            ~/.yarn/berry/cache
            .yarn/cache
            node_modules/.cache
          restore-keys: |-
            ${{ runner.os }}-${{ runner.arch }}-node-v2-stage-preflight-
            ${{ runner.os }}-${{ runner.arch }}-node-v2-
    - name: Record Restored Package Caches
      if: ${{ (steps.runner_caches.outputs.host == '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      continue-on-error: true
      run: |
        # ENACT_CACHE_DELTA: one `<cache id> <path>` line per cached path.
        delta_dir="${RUNNER_TEMP:-/tmp}/enact-cache-delta"
        delta_ids() { awk 'NF { print $1 }' <<<"$ENACT_CACHE_DELTA" | sort -u; }
        # The entries under the cache's paths (dot entries pruned: locks and temporaries), sorted.
        delta_list() {
            local want="$1" id path
            while read -r id path; do
                [ "$id" = "$want" ] || continue
                path="${path/#\~/$HOME}"
                [ -d "$path" ] || continue
                find "$path" -mindepth 1 -name '.*' -prune -o -print 2>/dev/null || true
            done <<<"$ENACT_CACHE_DELTA" | LC_ALL=C sort -u
        }
        set -euo pipefail
        mkdir -p "$delta_dir"
        for id in $(delta_ids); do
            delta_list "$id" > "$delta_dir/$id.restored"
            printf '%s: %s entries after the restore\n' "$id" "$(wc -l < "$delta_dir/$id.restored")"
        done
      env:
        ENACT_CACHE_DELTA: |-
          node_l1_cache /tmp/.cache/yarn
          node_l1_cache ~/.yarn/berry/cache
          node_l1_cache .yarn/cache
          node_l1_cache node_modules/.cache
    - name: Pull Dependencies via enve
      if: ${{ steps.stage_plan.outputs.stage_has_work == 'true' }}
      run: |-
        store="${ENVE_STORE_DIR:-$HOME/.local/share/enve/store}"
        if [ -d "/nix" ]; then
          if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
            cp -rn /nix/store/* "$store/" 2>/dev/null || true
            rm -rf /nix/store 2>/dev/null || true
          fi
          ln -sfn "$store" /nix/store 2>/dev/null || true
        fi
        if [ -f "enve.lock" ]; then
          if [ -n "$ENACT_R2_BUCKET" ] && ! enve run --locked -- true 2>/dev/null; then
            enve cache pull enve.lock --cache "$ENACT_R2_BUCKET" -j 16
          fi
          enve run --locked -- true
        fi
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENVE_CACHE_CONCURRENCY: "16"
    - name: Check enve Stores into the Host Cache
      if: ${{ (steps.runner_caches.outputs.host != '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      run: |
        #!/usr/bin/env bash
        # enve materializes into `ENVE_STORE_DIR` only while it trusts the directory, and otherwise
        # falls back to its user store or `/tmp/enve-<uid>/store` without failing: on a runner with
        # a host cache that throws the persistent store away on every run. Fails when the job's enve
        # calls wrote into a fallback since the runner cache probe.
        set -euo pipefail
        stamp="${RUNNER_TEMP:-/tmp}/enact-host-cache.stamp"
        for fallback in "${XDG_DATA_HOME:-$HOME/.local/share}/enve/store" "/tmp/enve-$(id -u)/store"; do
            { [ "$fallback" != "$ENVE_STORE_DIR" ] && [ -d "$fallback" ]; } || continue
            if [ -n "$(find "$fallback" -mindepth 1 -maxdepth 1 -newer "$stamp" -print -quit 2>/dev/null)" ]; then
                echo "::error::enve stored into $fallback, not the host cache's $ENVE_STORE_DIR, which it doesn't trust (an owner other than $(id -un) or root, or writable by others)"
                exit 1
            fi
        done
        echo "enve stores into the host cache: $ENVE_STORE_DIR"
    - name: Install Project Dependencies
      if: ${{ (hashFiles('package.json') != '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      run: |-
        RUN_PREFIX=""
        if command -v enve >/dev/null 2>&1 && [ -f "enve.lock" ]; then
          RUN_PREFIX="enve run --locked -- "
        fi
        echo "📦 Installing project dependencies..."
        ENACT_INSTALL_INPUTS=$(mktemp "$RUNNER_TEMP/enact-install-inputs.XXXXXX")
        sha256sum yarn.lock > "$ENACT_INSTALL_INPUTS"
        for input in package.json enve.lock; do
          if [ -f "$input" ]; then sha256sum "$input" >> "$ENACT_INSTALL_INPUTS"; fi
        done
        $RUN_PREFIX yarn install --immutable 2>/dev/null || $RUN_PREFIX yarn install --frozen-lockfile || exit $?
        sha256sum --check "$ENACT_INSTALL_INPUTS"
        rm "$ENACT_INSTALL_INPUTS"
        echo "ENACT_PREPARED=${ENACT_PREPARED:+$ENACT_PREPARED,}node" >> "$GITHUB_ENV"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Verify Pipeline Contracts & Sparse Cones (enact ci-verify)
      run: |-
        ENACT_BIN=""
        if command -v enact >/dev/null 2>&1; then
          ENACT_BIN="enact"
        elif [ -x "bin/enact" ]; then
          ENACT_BIN="bin/enact"
        fi
        if [ -n "$ENACT_BIN" ]; then
          echo "🔬 Running enact ci-verify..."
          $ENACT_BIN ci-verify --pipeline .enact --workflow ci
        fi
    - name: Execute Stage [Preflight]
      if: ${{ steps.stage_plan.outputs.stage_has_work == 'true' }}
      run: |-
        # Resolves the diff base, and leaves the planning flags of the `enact` command after this
        # script in "$@": --base, --all or --updated and --files, --no-cache.
        # Fetches carry commits and trees only, and name their refs: a bare `origin` fetches (or
        # deepens) every branch of the remote.
        FETCH="git fetch --no-tags --filter=blob:none origin"
        # Whether the clone has the revision, never fetching it: `rev-parse --verify` accepts any
        # full hash, and a partial clone's object lookups (`merge-base` too) fetch a missing commit
        # with its whole history.
        has_commit() {
          [ -n "$(git rev-list -n1 --no-walk --ignore-missing --missing=allow-any "$1" -- 2>/dev/null)" ]
        }
        BASE_REV=""
        BASE_REF="${ENACT_BASE_REF:-}"
        if [ -n "${ENACT_BASE_SHA:-}" ]; then
          has_commit "$ENACT_BASE_SHA" || $FETCH --depth=1 "$ENACT_BASE_SHA" 2>/dev/null || true
          if has_commit "$ENACT_BASE_SHA"; then
            BASE_REV="$ENACT_BASE_SHA"
          fi
        fi
        if [ -n "${GITHUB_HEAD_SHA:-}" ]; then
          has_commit "$GITHUB_HEAD_SHA" || $FETCH --depth=1 "$GITHUB_HEAD_SHA" 2>/dev/null || true
        fi
        if [ -z "$BASE_REV" ] && [ -z "$BASE_REF" ]; then
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ -n "${ENACT_EVENT_BEFORE:-}" ] && [ "${ENACT_EVENT_BEFORE:-}" != "0000000000000000000000000000000000000000" ]; then
              BASE_REF="${ENACT_EVENT_BEFORE:-}"
            else
              BASE_REF="HEAD~1"
            fi
          else
            INTEGRATION_BRANCH="${ENACT_INTEGRATION_BRANCH:-}"
            if [ -n "$INTEGRATION_BRANCH" ] && [ "$GITHUB_REF_NAME" != "$INTEGRATION_BRANCH" ] && [ "$GITHUB_REF_NAME" != "${ENACT_DEFAULT_BRANCH:-master}" ]; then
              has_commit "origin/$INTEGRATION_BRANCH" || $FETCH --depth=1 "+refs/heads/$INTEGRATION_BRANCH:refs/remotes/origin/$INTEGRATION_BRANCH" 2>/dev/null || true
              if has_commit "origin/$INTEGRATION_BRANCH"; then
                BASE_REF="$INTEGRATION_BRANCH"
              fi
            fi
            if [ -z "$BASE_REF" ]; then
              BASE_REF="${ENACT_DEFAULT_BRANCH:-master}"
            fi
          fi
        fi
        if [ -z "$BASE_REV" ] && [ -n "$BASE_REF" ]; then
          # The base fetches as a commit (a full hash) or a branch (into its remote-tracking ref),
          # one deep; a revision of HEAD's own (HEAD~1) is in HEAD's history.
          BASE_SPEC="+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          case "$BASE_REF" in
            HEAD | HEAD[~^]*) BASE_SPEC="" ;;
            *[!0-9a-f]*) ;;
            *) if [ ${#BASE_REF} -ge 40 ]; then BASE_SPEC="$BASE_REF"; fi ;;
          esac
          if [ -n "$BASE_SPEC" ] && ! has_commit "$BASE_REF" && ! has_commit "origin/$BASE_REF"; then
            $FETCH --depth=1 "$BASE_SPEC" 2>/dev/null || true
          fi
          # The base as this clone names it, if it has it.
          base_at() {
            if has_commit "$BASE_REF"; then
              echo "$BASE_REF"
            elif has_commit "origin/$BASE_REF"; then
              echo "origin/$BASE_REF"
            fi
          }
          merge_base() {
            BASE_AT=$(base_at)
            if [ -n "$BASE_AT" ]; then
              git merge-base HEAD "$BASE_AT" 2>/dev/null || true
            fi
          }
          # A shallow clone deepens HEAD and the base alone, in growing steps, until they meet;
          # unshallowing them is the last resort. They are named by commit: fetch skips a ref
          # that is already up to date, and so leaves it as shallow as it was.
          DEEPEN=$(git rev-parse HEAD)
          BASE_AT=$(base_at)
          if [ -n "$BASE_SPEC" ] && [ -n "$BASE_AT" ]; then
            DEEPEN="$DEEPEN $(git rev-parse "$BASE_AT")"
          fi
          MERGE_BASE=$(merge_base)
          for STEP in --deepen=50 --deepen=200 --deepen=1000 --unshallow; do
            if [ -n "$MERGE_BASE" ] || [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" != "true" ]; then
              break
            fi
            # shellcheck disable=SC2086 # one word per commit
            $FETCH "$STEP" $DEEPEN 2>/dev/null || true
            MERGE_BASE=$(merge_base)
          done
          BASE_REV="${MERGE_BASE:-$(base_at)}"
        fi
        if [ -z "$BASE_REV" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
          if has_commit HEAD~1; then
            BASE_REV="HEAD~1"
          fi
        fi
        # The reach map planning reads is the reach store's newest at an ancestor of HEAD: a
        # shallow clone sees too little history to find it, so the pull deepens it (commits only)
        # back to the stored maps' commits, and downloads from the remote tier when there is one.
        # A job handed detect's map (ENACT_REACH_FILE) plans with that one.
        if [ -z "${ENACT_REACH_FILE:-}" ]; then
          enact trace store pull || true
        fi
        # The reach map's footprints are aged by what changed since the revisions they were
        # traced at: fetch those the shallow clone lacks, else each ages whole. Their
        # trees only: aging diffs trees, and reads the few blobs it compares by function lazily.
        MAP_REVISIONS=$(enact trace revisions --missing 2>/dev/null || true)
        if [ -n "$MAP_REVISIONS" ]; then
          MAP_FETCH="$FETCH --depth=1"
          # shellcheck disable=SC2086 # one word per revision
          $MAP_FETCH $MAP_REVISIONS 2>/dev/null || for rev in $MAP_REVISIONS; do
            $MAP_FETCH "$rev" 2>/dev/null || true
          done
        fi
        # Pushes to the default branch and same-repo pull requests record the footprints of the
        # tests they run untraced or stale (`enact run`'s recording, off elsewhere on CI).
        if [ -z "${ENACT_RECORD:-}" ]; then
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "${GITHUB_REF_NAME:-}" = "${ENACT_DEFAULT_BRANCH:-master}" ]; then
            export ENACT_RECORD=auto
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "${GITHUB_HEAD_REF:-}" ] && [ "${GITHUB_HEAD_REF:-}" != "${ENACT_DEFAULT_BRANCH:-master}" ] && [ "${ENACT_SAME_REPO_PR:-true}" != "false" ]; then
            export ENACT_RECORD=auto
          fi
        fi
        # A warm-up (dispatched with warm_reach on the default branch) runs every suite and records
        # every test without a fresh footprint.
        WARM_REACH=""
        if [ "${ENACT_INPUT_WARM_REACH:-}" = "true" ] && [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${GITHUB_REF_NAME:-}" = "${ENACT_DEFAULT_BRANCH:-master}" ]; then
          export ENACT_RECORD=every
          WARM_REACH=1
        fi
        set --
        if [ -n "$BASE_REV" ]; then
          set -- "$@" --base "$BASE_REV"
        fi
        if [ "${ENACT_INPUT_ALL:-}" = "true" ] || [ -n "$WARM_REACH" ]; then
          set -- "$@" --all
        else
          if [ -n "${ENACT_INPUT_UPDATED:-}" ]; then
            set -- "$@" --updated "$ENACT_INPUT_UPDATED"
          fi
          # A dispatch's files plan as the change. Each must be a file of HEAD's tree (read from
          # its trees, so a sparse or blobless checkout answers too), or a typo plans nothing and
          # the run passes.
          if [ -n "${ENACT_INPUT_FILES:-}" ]; then
            OLD_IFS=$IFS
            IFS=,
            set -f
            for path in $ENACT_INPUT_FILES; do
              case "$(git ls-tree HEAD -- "$path" 2>/dev/null)" in
                *" blob "*) ;;
                *)
                  echo "::error::files input: '$path' is no file at HEAD (comma-separated paths from the repository root)"
                  exit 1
                  ;;
              esac
            done
            set +f
            IFS=$OLD_IFS
            set -- "$@" --files "$ENACT_INPUT_FILES"
          fi
        fi
        if [ "${ENACT_FORCE_NO_CACHE:-}" = "true" ]; then
          set -- "$@" --no-cache
        fi
        enact run --pipeline .enact --workflow ci "$@" --stage preflight
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_BASE_REF: ${{ inputs.base_ref || github.base_ref || github.event.pull_request.base.ref }}
        ENACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        ENACT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'master' }}
        ENACT_EVENT_BEFORE: ${{ github.event.before }}
        ENACT_FORCE_NO_CACHE: ${{ inputs.no_cache == 'true' || vars.ENACT_NO_CACHE == 'true' || contains(github.event.pull_request.title, '[no-cache]') || contains(github.event.pull_request.body, '[no-cache]') || contains(github.event.pull_request.labels.*.name, 'no-cache') || contains(github.event.pull_request.labels.*.name, 'showcase') || startsWith(github.head_ref, 'showcase/') || startsWith(github.ref_name, 'showcase/') }}
        ENACT_INPUT_ALL: ${{ inputs.all }}
        ENACT_INPUT_FILES: ${{ inputs.files }}
        ENACT_INPUT_UPDATED: ${{ inputs.updated }}
        ENACT_INPUT_WARM_REACH: ${{ inputs.warm_reach }}
        ENACT_INTEGRATION_BRANCH: ${{ vars.ENACT_INTEGRATION_BRANCH }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENACT_SAME_REPO_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        GITHUB_HEAD_REF: ${{ github.head_ref }}
        GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    - name: Check Package Caches for New Entries
      id: cache_delta
      if: ${{ (!cancelled() && steps.runner_caches.outputs.host == '' && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')) && steps.stage_plan.outputs.stage_has_work == 'true' }}
      continue-on-error: true
      run: |
        # ENACT_CACHE_DELTA: one `<cache id> <path>` line per cached path.
        delta_dir="${RUNNER_TEMP:-/tmp}/enact-cache-delta"
        delta_ids() { awk 'NF { print $1 }' <<<"$ENACT_CACHE_DELTA" | sort -u; }
        # The entries under the cache's paths (dot entries pruned: locks and temporaries), sorted.
        delta_list() {
            local want="$1" id path
            while read -r id path; do
                [ "$id" = "$want" ] || continue
                path="${path/#\~/$HOME}"
                [ -d "$path" ] || continue
                find "$path" -mindepth 1 -name '.*' -prune -o -print 2>/dev/null || true
            done <<<"$ENACT_CACHE_DELTA" | LC_ALL=C sort -u
        }
        RUN_PREFIX=""
        if command -v enve >/dev/null 2>&1 && [ -f "enve.lock" ]; then
          RUN_PREFIX="enve run --locked -- "
        fi
        set -uo pipefail
        mkdir -p "$delta_dir"
        # uv's CI prune drops the wheels PyPI serves again and keeps the ones built from source.
        if [ "${ENACT_UV_PRUNE:-}" = true ] && [ -d "${UV_CACHE_DIR:-}" ]; then
            # shellcheck disable=SC2086 # the prefix is a command line
            ${RUN_PREFIX}uv cache prune --ci || echo "uv cache prune skipped"
        fi
        for id in $(delta_ids); do
            now="$delta_dir/$id.now"
            delta_list "$id" > "$now"
            if [ ! -s "$now" ]; then
                changed=false why="nothing to save"
            elif [ ! -f "$delta_dir/$id.restored" ]; then
                changed=true why="no record of its restore"
            else
                added=$(LC_ALL=C comm -13 "$delta_dir/$id.restored" "$now" | wc -l | tr -d ' ')
                if [ "$added" -gt 0 ]; then changed=true; else changed=false; fi
                why="$added entries the restore lacked"
            fi
            printf '%s=%s\n' "$id" "$changed" >> "$GITHUB_OUTPUT"
            printf '%s: save %s (%s)\n' "$id" "$changed" "$why"
        done
      env:
        ENACT_CACHE_DELTA: |-
          node_l1_cache /tmp/.cache/yarn
          node_l1_cache ~/.yarn/berry/cache
          node_l1_cache .yarn/cache
          node_l1_cache node_modules/.cache
    - parallel:
      - name: Save Node dependency cache
        if: ${{ (((github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.cache_delta.outputs.node_l1_cache == 'true' && steps.runner_caches.outputs.host == '') && steps.node_l1_cache.outputs.cache-hit != 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.node_l1_cache.outputs.cache-primary-key }}
          path: |-
            /tmp/.cache/yarn
            ~/.yarn/berry/cache
            .yarn/cache
            node_modules/.cache
    - name: Upload Telemetry for [preflight]
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: telemetry-stage-preflight
        path: |-
          .enact/state/telemetry.json
          .enact/state/summary.html
          .enact/state/runs/*/services/*.log
        retention-days: "1"
    - name: Upload Recorded Footprints
      if: ${{ always() && (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != github.event.repository.default_branch || github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch) }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: enact-footprints-stage-preflight
        path: .enact/state/cache/trace-reach.d/
        retention-days: "1"
  reach:
    name: Consolidate Reach Map
    needs:
    - detect
    - preflight
    - test
    - build-outputs
    - test-built
    if: ${{ !cancelled() && (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != github.event.repository.default_branch || github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch) }}
    runs-on:
    - self-hosted
    - Linux
    - X64
    - tonky-ci
    - tonky-ci-s
    timeout-minutes: 10
    steps:
    - name: Probe Runner Caches
      id: runner_caches
      run: |
        #!/usr/bin/env bash
        # The runner's host cache: `ENACT_HOST_CACHE` names a directory the host mounts read-write
        # into every job and keeps across jobs. `repo/` holds this repository's stores; `shared/`,
        # seen by every repository the host serves, holds only signature-verified content: the enve
        # NAR mirror (`ENVE_MIRROR`), which enve reads first and fills with the paths it pulled and
        # verified (signed by cache.nixos.org or a key in `ENVE_TRUSTED_PUBLIC_KEYS`); a tampered
        # entry fails verification and enve falls back to the next substituter. Concurrent jobs share both: enve, uv, pnpm and Go lock their
        # own stores, and the git mirror is fetched under a lock. The host drops the least recently
        # used entries under `repo/` and `shared/` whole, so each store owns one, touched on every use.
        set -euo pipefail
        host="${ENACT_HOST_CACHE:-}"
        if [ -n "$host" ] && ! { [ -d "$host/repo" ] && [ -w "$host/repo" ]; }; then
            echo "::warning::ENACT_HOST_CACHE=$host has no writable repo/ directory; using GitHub's cache"
            host=""
        fi
        # enve's trust check of a store directory, which it otherwise leaves for a fallback store
        # without a word: from `/` down, each component owned by root or the user and writable by
        # no one else, a root-owned sticky ancestor excepted.
        trusted_store() {
            local path="" part owner mode uid
            uid=$(id -u)
            IFS=/ read -ra parts <<<"${1#/}"
            for part in "${parts[@]}"; do
                path="$path/$part"
                read -r owner mode < <(stat -c '%u %a' "$path" 2>/dev/null || stat -f '%u %Mp%Lp' "$path")
                mode=$((8#$mode))
                [ "$owner" = 0 ] || [ "$owner" = "$uid" ] || return 1
                if (( mode & 8#22 )); then
                    [ "$owner" = 0 ] && (( mode & 8#1000 )) && [ "$path" != "$1" ] || return 1
                fi
            done
        }
        # The layout, one line per store: `<variable> <entry> <path under the entry>`; the git mirror
        # names a repository, every other path a directory.
        layout() {
            cat <<LAYOUT
        ENVE_STORE_DIR repo/enve-store .
        UV_CACHE_DIR repo/uv .
        PIP_CACHE_DIR repo/pip .
        ENACT_PNPM_STORE repo/pnpm .
        npm_config_cache repo/npm .
        YARN_CACHE_FOLDER repo/yarn .
        BUN_INSTALL_CACHE_DIR repo/bun .
        GOMODCACHE repo/go mod
        GOCACHE repo/go build
        ENACT_GIT_MIRROR repo/git ${GITHUB_REPOSITORY##*/}.git
        ENVE_MIRROR shared/enve-nar .
        LAYOUT
        }
        if [ -n "$host" ]; then
            # The repository's stores are writable by no one else: enve trusts no other store.
            # `shared/` stays as the host made it, writable by the jobs of every repository.
            umask 022
            chmod go-w "$host/repo" 2>/dev/null || true
            # The enve store check reads what enve wrote since.
            touch "${RUNNER_TEMP:-/tmp}/enact-host-cache.stamp"
            while read -r var entry path; do
                # The host provides `shared/`; without it the NAR mirror is skipped.
                { [ -d "$host/${entry%%/*}" ] && [ -w "$host/${entry%%/*}" ]; } || continue
                mkdir -p "$host/$entry"
                touch "$host/$entry"
                dir="$host/$entry/$path"
                case "$var" in
                    ENACT_GIT_MIRROR) ;;
                    *) mkdir -p "$dir" ;;
                esac
                dir="${dir%/.}"
                if [ "${entry%%/*}" = repo ]; then
                    chmod 755 "$host/$entry" 2>/dev/null || true
                    [ ! -d "$dir" ] || chmod 755 "$dir" 2>/dev/null || true
                fi
                if [ "$var" = ENVE_STORE_DIR ] && ! trusted_store "$dir"; then
                    echo "::error::enve won't trust $dir (an owner other than $(id -un) or root, or writable by others, on the way from /) and would store elsewhere: fix the host cache's ownership and modes"
                    exit 1
                fi
                [ "$var" != ENVE_MIRROR ] || dir="file://$dir"
                echo "$var=$dir" >> "$GITHUB_ENV"
            done < <(layout)
        fi
        echo "ENACT_HOST_CACHE=$host" >> "$GITHUB_ENV"
        printf 'host=%s\n' "$host" >> "$GITHUB_OUTPUT"
        printf 'Host cache: %s\n' "${host:-none}"
    - name: Checkout Repository (sparse) from the Host Mirror
      id: host_checkout
      if: ${{ steps.runner_caches.outputs.host != '' }}
      continue-on-error: true
      run: |
        #!/usr/bin/env bash
        # Checks the commit out through the host cache's mirror of the repository
        # (`ENACT_GIT_MIRROR`, from the runner cache probe): the mirror fetches what it lacks under its
        # lock, and the work tree borrows its objects (alternates), so the checkout has the whole
        # history at the cost of a few new commits. `ENACT_SPARSE_CONE`: the cone's directories,
        # one per line; none checks the whole tree out.
        set -euo pipefail
        git config --global --add safe.directory "*"
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        mirror="$ENACT_GIT_MIRROR"
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENACT_GIT_TOKEN" | base64 | tr -d '\n')"
        refs=("+refs/heads/*:refs/heads/*")
        case "$GITHUB_REF" in
            refs/pull/*) refs+=("+$GITHUB_REF:$GITHUB_REF") ;;
        esac
        (
            flock 9
            if [ ! -f "$mirror/HEAD" ]; then
                git init -q --bare "$mirror"
                git -C "$mirror" config uploadpack.allowAnySHA1InWant true
                git -C "$mirror" config gc.auto 0
            fi
            git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags --prune "$url" "${refs[@]}"
            if ! git -C "$mirror" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
                git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags "$url" "$GITHUB_SHA"
            fi
        ) 9>"$mirror.lock"
        cd "$GITHUB_WORKSPACE"
        # A half-made repository would mislead the fallback checkout into reusing it.
        trap 'rm -rf "$GITHUB_WORKSPACE/.git"' ERR
        # A fresh work tree, as actions/checkout leaves one: nothing of an earlier job survives.
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        echo "$mirror/objects" > .git/objects/info/alternates
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local gc.auto 0
        git fetch -q --no-tags "$mirror" "+refs/heads/*:refs/remotes/origin/*"
        if [ -n "${ENACT_SPARSE_CONE:-}" ]; then
            mapfile -t cone < <(printf '%s\n' "$ENACT_SPARSE_CONE" | sed '/^[[:space:]]*$/d')
            git sparse-checkout set --cone "${cone[@]}"
        fi
        case "$GITHUB_REF" in
            refs/heads/*) git checkout -q --force -B "${GITHUB_REF#refs/heads/}" "$GITHUB_SHA" ;;
            *) git checkout -q --force --detach "$GITHUB_SHA" ;;
        esac
        git log -1 --format='Checked out %H through the host mirror'
      env:
        ENACT_GIT_TOKEN: ${{ github.token }}
        ENACT_SPARSE_CONE: |-
          .enact
          cue.mod
          .github
          bin
    - name: Checkout Repository (sparse)
      if: ${{ steps.runner_caches.outputs.host == '' || steps.host_checkout.outcome == 'failure' }}
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        sparse-checkout: |-
          .enact
          cue.mod
          .github
          bin
        sparse-checkout-cone-mode: "true"
        submodules: "false"
    - name: Install committed enact & enve builds
      run: |
        # The repository's committed enact, enve and bubblewrap builds: bin/<os>-<arch>/ for this runner
        # (bin/linux-x86_64/, bin/linux-aarch64/), else bin/. They're copied to ~/.cargo/bin,
        # which goes ahead of bin/ on PATH, so the runner's own build wins over bin/'s. A build for
        # another CPU (an x86_64 enve on an arm64 runner) is never installed: enact or enve fails
        # here, naming the directory to commit, instead of the first step that runs it.
        BIN_DIR="${GITHUB_WORKSPACE:-$PWD}/bin"
        PLATFORM="$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/^darwin$/macos/')-$(uname -m | sed 's/^arm64$/aarch64/')"
        # Whether this runner can execute $1: false only for an ELF of another CPU or OS.
        runs_here() {
          local header
          header="$(od -An -tx1 -N20 "$1" 2>/dev/null | tr -d ' \n')"
          [ "${header:0:8}" = 7f454c46 ] || return 0
          case "$PLATFORM:${header:36:4}" in
            linux-x86_64:3e00 | linux-aarch64:b700) return 0 ;;
          esac
          return 1
        }
        mkdir -p "$HOME/.cargo/bin"
        if [ -d "$BIN_DIR" ]; then
          for b in enact enve bwrap; do
            src="$BIN_DIR/$b"
            if [ -f "$BIN_DIR/$PLATFORM/$b" ]; then
              src="$BIN_DIR/$PLATFORM/$b"
            fi
            [ -f "$src" ] || continue
            if ! runs_here "$src"; then
              if [ "$b" = bwrap ]; then
                echo "::warning::bin/$b is a build for another CPU than this $PLATFORM runner: not installed"
                continue
              fi
              echo "::error title=No $b for $PLATFORM::bin/$b is a build for another CPU; commit this runner's as bin/$PLATFORM/$b"
              exit 1
            fi
            chmod +x "$src" 2>/dev/null || true
            cp -f "$src" "$HOME/.cargo/bin/$b"
          done
          echo "$BIN_DIR" >> "$GITHUB_PATH"
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Ensure enve & enact CLI on PATH
      run: |
        git config --global --add safe.directory "*" 2>/dev/null || true
        # The store the runner cache probe chose (a host cache's), else the user store.
        store="${ENVE_STORE_DIR:-$HOME/.local/share/enve/store}"
        mkdir -p "$store"
        if command -v sudo >/dev/null 2>&1; then
          sudo mkdir -p -m 0755 /nix 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" /nix 2>/dev/null || true
        fi
        if [ -d "/nix" ]; then
          if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
            cp -rn /nix/store/* "$store/" 2>/dev/null || true
            rm -rf /nix/store 2>/dev/null || true
          fi
          ln -sfn "$store" /nix/store 2>/dev/null || true
        fi
        # The previous step's $GITHUB_PATH entries apply from the next step on.
