# Generated by enact from .enact; edit the pipeline and run `enact ci generate`.
name: grafana
on:
  push:
    branches:
    - main
    - perf/ci-showcase
  pull_request:
    branches:
    - main
    - perf/ci-showcase
  workflow_dispatch:
    inputs:
      all:
        description: Force execution of all components regardless of git changes
        required: false
        default: "false"
      base_ref:
        description: Target base branch for diff detection (e.g. main, master, a release branch)
        required: false
      files:
        description: File(s) to plan as changed instead of the git diff, comma-separated (e.g. one test file)
        required: false
      no_cache:
        description: Disable task cache, forcing full execution
        required: false
        default: "false"
      updated:
        description: Component(s) to emulate as updated
        required: false
      warm_reach:
        description: Run every suite and record each test without a fresh reach footprint (on the default branch, after an enact upgrade)
        required: false
        default: "false"
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  ENVE_CACHE_PUBLIC_KEY: enve-r2-1:ckHPTeWVef6mba+1AwWHjKYCsUWKPfP9IXPm5YXNoHg=
  ENVE_SERVICE_GID: "1000"
  ENVE_SERVICE_UID: "1000"
  ENVE_SUBSTITUTERS: https://pub-30fd937eb7634039b8c49d49bfec91a9.r2.dev,https://cache.nixos.org
  ENVE_TRUSTED_PUBLIC_KEYS: enve-r2-1:ckHPTeWVef6mba+1AwWHjKYCsUWKPfP9IXPm5YXNoHg=
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GOCACHE: /tmp/go-build
  GOPATH: /tmp/go
  UV_CACHE_DIR: /tmp/.cache/uv
  XDG_CACHE_HOME: /tmp/.cache
jobs:
  build-outputs:
    name: Build Outputs (${{ matrix.component }})
    needs:
    - detect
    if: ${{ needs.detect.outputs.builds != '{"include":[]}' && needs.detect.outputs.builds != '[]' && needs.detect.outputs.builds != '' }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJson(needs.detect.outputs.builds) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    steps:
    - name: Probe Runner Caches
      id: runner_caches
      run: |
        set -euo pipefail
        host="${ENACT_HOST_CACHE:-}"
        if [ -n "$host" ] && ! { [ -d "$host/repo" ] && [ -w "$host/repo" ]; }; then
            echo "::warning::ENACT_HOST_CACHE=$host has no writable repo/ directory; using GitHub's cache"
            host=""
        fi
        if [ -n "$host" ]; then
            mkdir -p "$host/repo/git" "$host/repo/outputs"
            echo "ENACT_GIT_MIRROR=$host/repo/git/${GITHUB_REPOSITORY##*/}.git" >> "$GITHUB_ENV"
            echo "ENACT_OUTPUTS_CACHE=$host/repo/outputs" >> "$GITHUB_ENV"
        fi
        echo "ENACT_HOST_CACHE=$host" >> "$GITHUB_ENV"
        printf 'host=%s\n' "$host" >> "$GITHUB_OUTPUT"
        printf 'Host cache: %s\n' "${host:-none}"
    - name: Look Up Built Outputs in the Host Cache
      id: outputs-host-lookup
      if: ${{ steps.runner_caches.outputs.host != '' }}
      continue-on-error: true
      run: |
        set -euo pipefail
        store="${ENACT_OUTPUTS_CACHE:-}"
        entry="$store/${GITHUB_REPOSITORY:-repo}/$ENACT_OUTPUTS_KEY"
        clone_item() {
            rm -rf "$2"
            mkdir -p "$(dirname "$2")"
            cp -a --reflink=auto "$1" "$2" 2>/dev/null || { rm -rf "$2"; cp -a "$1" "$2"; }
        }
        case "$ENACT_OUTPUTS_MODE" in
            lookup)
                hit=false
                if [ -n "$store" ] && [ -f "$entry/.enact-ready" ]; then
                    hit=true
                    while IFS= read -r pattern; do
                        [ -n "$pattern" ] || continue
                        # shellcheck disable=SC2086 # glob pattern from outputs.paths
                        for src in "$entry"/$pattern; do
                            [ -e "$src" ] || [ -L "$src" ] || { hit=false; break 2; }
                        done
                    done <<<"$ENACT_OUTPUTS_PATHS"
                fi
                if [ "$hit" = true ]; then
                    touch "$entry/.enact-ready" 2>/dev/null || true
                fi
                printf 'cache-hit=%s\n' "$hit" >> "$GITHUB_OUTPUT"
                ;;
            restore)
                hit=false
                if [ -n "$store" ] && [ -f "$entry/.enact-ready" ]; then
                    hit=true
                    while IFS= read -r pattern; do
                        [ -n "$pattern" ] || continue
                        # shellcheck disable=SC2086 # glob pattern from outputs.paths
                        for src in "$entry"/$pattern; do
                            [ -e "$src" ] || [ -L "$src" ] || { hit=false; break 2; }
                            rel="${src#"$entry"/}"
                            clone_item "$src" "$rel" || { hit=false; break 2; }
                        done
                    done <<<"$ENACT_OUTPUTS_PATHS"
                fi
                if [ "$hit" = true ]; then
                    touch "$entry/.enact-ready" 2>/dev/null || true
                fi
                printf 'cache-hit=%s\n' "$hit" >> "$GITHUB_OUTPUT"
                ;;
            save)
                [ -n "$store" ] || exit 0
                [ ! -f "$entry/.enact-ready" ] || exit 0
                mkdir -p "$(dirname "$entry")"
                tmp=$(mktemp -d "$entry.tmp.XXXXXX")
                trap 'rm -rf "$tmp"' EXIT
                while IFS= read -r pattern; do
                    [ -n "$pattern" ] || continue
                    # shellcheck disable=SC2086 # glob pattern from outputs.paths
                    for src in $pattern; do
                        [ -e "$src" ] || [ -L "$src" ] || exit 1
                        clone_item "$src" "$tmp/$src"
                    done
                done <<<"$ENACT_OUTPUTS_PATHS"
                touch "$tmp/.enact-ready"
                chmod -R a+rX "$tmp" 2>/dev/null || true
                if ! mv -n "$tmp" "$entry" 2>/dev/null && [ ! -d "$entry" ]; then
                    rm -rf "$entry"
                    mv "$tmp" "$entry"
                fi
                repo_dir="$(dirname "$entry")"
                max_entries="${ENACT_OUTPUTS_CACHE_MAX_ENTRIES:-8}"
                min_free_mb="${ENACT_OUTPUTS_CACHE_MIN_FREE_MB:-5120}"
                ready_files=()
                while IFS= read -r ready; do
                    [ -n "$ready" ] && ready_files+=("$ready")
                done < <(ls -1dt "$repo_dir"/*/.enact-ready 2>/dev/null || true)
                total="${#ready_files[@]}"
                for (( idx = total - 1; idx >= 0; idx-- )); do
                    cand_dir="$(dirname "${ready_files[$idx]}")"
                    [ "$cand_dir" != "$entry" ] || continue
                    evict=false
                    if [ "$max_entries" -gt 0 ] && [ "$((idx + 1))" -gt "$max_entries" ]; then
                        evict=true
                    elif [ "$min_free_mb" -gt 0 ]; then
                        free_mb="$(df -Pk "$store" 2>/dev/null | awk 'NR==2 {print int($4 / 1024)}')"
                        if [ -n "$free_mb" ] && [ "$free_mb" -lt "$min_free_mb" ]; then
                            evict=true
                        fi
                    fi
                    if [ "$evict" = true ]; then
                        rm -rf "$cand_dir" 2>/dev/null || true
                    fi
                done
                ;;
        esac
      env:
        ENACT_OUTPUTS_KEY: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_key }}
        ENACT_OUTPUTS_MODE: lookup
        ENACT_OUTPUTS_PATHS: ${{ matrix.output_paths }}
    - name: Look Up Built Outputs
      id: outputs-lookup
      if: ${{ steps.outputs-host-lookup.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_key }}
        lookup-only: "true"
        path: ${{ matrix.output_paths }}
    - name: Skip on Built Outputs Found
      id: skip
      run: "[ \"$HIT\" != true ] || echo hit=true >> \"$GITHUB_OUTPUT\""
      env:
        HIT: ${{ steps.outputs-host-lookup.outputs.cache-hit == 'true' || steps.outputs-lookup.outputs.cache-hit == 'true' }}
    - name: Checkout Repository (sparse) from the Host Mirror
      id: host_checkout
      if: ${{ (steps.runner_caches.outputs.host != '') && !steps.skip.outputs.hit }}
      continue-on-error: true
      run: |
        set -euo pipefail
        git config --global --add safe.directory "*"
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        mirror="$ENACT_GIT_MIRROR"
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENACT_GIT_TOKEN" | base64 | tr -d '\n')"
        refs=("+refs/heads/*:refs/heads/*")
        case "$GITHUB_REF" in
            refs/pull/*) refs+=("+$GITHUB_REF:$GITHUB_REF") ;;
        esac
        (
            flock 9
            if [ ! -f "$mirror/HEAD" ]; then
                git init -q --bare "$mirror"
                git -C "$mirror" config uploadpack.allowAnySHA1InWant true
                git -C "$mirror" config gc.auto 0
            fi
            ref_current=""
            case "$GITHUB_REF" in
                refs/heads/*|refs/pull/*) ref_current=$(git -C "$mirror" rev-parse --verify -q "$GITHUB_REF^{commit}" 2>/dev/null || true) ;;
                *) ref_current="$GITHUB_SHA" ;;
            esac
            if [ -z "$(find "$mirror/HEAD" -mmin -1 2>/dev/null || true)" ] || [ "$ref_current" != "$GITHUB_SHA" ] || ! git -C "$mirror" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
                git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags --prune "$url" "${refs[@]}"
                if ! git -C "$mirror" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
                    git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags "$url" "$GITHUB_SHA"
                fi
            fi
            touch "$mirror" "$mirror/HEAD" 2>/dev/null || true
        ) 9>"$mirror.lock"
        cd "$GITHUB_WORKSPACE"
        trap 'rm -rf "$GITHUB_WORKSPACE/.git"' ERR
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        echo "$mirror/objects" > .git/objects/info/alternates
        [ ! -f "$mirror/shallow" ] || cp "$mirror/shallow" .git/shallow
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local gc.auto 0
        git fetch -q --no-tags "$mirror" "+refs/heads/*:refs/remotes/origin/*"
        if [ -n "${ENACT_SPARSE_CONE:-}" ]; then
            mapfile -t cone < <(printf '%s\n' "$ENACT_SPARSE_CONE" | sed '/^[[:space:]]*$/d')
            git sparse-checkout set --cone "${cone[@]}"
        fi
        case "$GITHUB_REF" in
            refs/heads/*) git checkout -q --force -B "${GITHUB_REF#refs/heads/}" "$GITHUB_SHA" ;;
            *) git checkout -q --force --detach "$GITHUB_SHA" ;;
        esac
        git log -1 --format='Checked out %H through the host mirror'
      env:
        ENACT_GIT_TOKEN: ${{ github.token }}
        ENACT_SPARSE_CONE: ${{ matrix.sparse_checkout }}
    - name: Checkout Repository (sparse)
      if: ${{ (matrix.sparse_checkout != '' && (steps.runner_caches.outputs.host == '' || steps.host_checkout.outcome == 'failure')) && !steps.skip.outputs.hit }}
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        sparse-checkout: ${{ matrix.sparse_checkout }}
        sparse-checkout-cone-mode: "true"
        submodules: "false"
    - name: Checkout Repository (full)
      if: ${{ (matrix.sparse_checkout == '' && (steps.runner_caches.outputs.host == '' || steps.host_checkout.outcome == 'failure')) && !steps.skip.outputs.hit }}
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        submodules: "false"
    - name: Install committed enact & enve builds
      if: ${{ !steps.skip.outputs.hit }}
      run: |
        P="$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/^darwin$/macos/')-$(uname -m | sed 's/^arm64$/aarch64/')"
        E="${GITHUB_WORKSPACE:-$PWD}/bin/$P/enact"
        [ -f "$E" ] || E="${GITHUB_WORKSPACE:-$PWD}/bin/enact"
        [ -f "$E" ] || E="$(command -v enact || echo "$HOME/.cargo/bin/enact")"
        chmod +x "$E" 2>/dev/null || true
        "$E" --version >/dev/null 2>&1 || { echo "::error title=No enact for $P::$E does not run on this $P runner; commit its build as bin/$P/enact"; exit 1; }
        "$E" ci install-binaries
    - name: Ensure enve & enact CLI on PATH
      if: ${{ !steps.skip.outputs.hit }}
      run: enact ci setup-runner
    - parallel:
      - name: Restore enact Task CAS Cache
        id: enact-tasks-cache
        if: ${{ !steps.skip.outputs.hit }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-enact-tasks-${{ github.sha }}
          path: .enact/state/cache
          restore-keys: ${{ runner.os }}-enact-tasks-
      - name: Restore Python build & venv cache
        id: python_l1_cache
        if: ${{ (hashFiles('**/uv.lock', '**/pyproject.toml', '**/requirements.txt', '**/poetry.lock') != '' && contains(matrix.technology, 'python') && steps.runner_caches.outputs.host == '') && !steps.skip.outputs.hit }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-python-${{ hashFiles('**/uv.lock', '**/pyproject.toml', '**/requirements.txt', '**/poetry.lock') }}
          path: |-
            /tmp/.cache/uv
            /tmp/.cache/pip
          restore-keys: ${{ runner.os }}-python-
      - name: Restore Go build cache
        id: go_l1_cache
        if: ${{ (hashFiles('**/go.mod', '**/go.sum') != '' && contains(matrix.technology, 'go') && steps.runner_caches.outputs.host == '') && !steps.skip.outputs.hit }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.mod', '**/go.sum') }}-${{ github.sha }}
          path: |-
            /tmp/go-build
            /tmp/go/pkg/mod
          restore-keys: |-
            ${{ runner.os }}-go-${{ hashFiles('**/go.mod', '**/go.sum') }}-
            ${{ runner.os }}-go-
      - name: Restore Node dependency cache
        id: node_l1_cache
        if: ${{ ((contains(matrix.technology, 'typescript') || contains(matrix.technology, 'javascript') || contains(matrix.technology, 'node')) && steps.runner_caches.outputs.host == '') && !steps.skip.outputs.hit }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-node-v2-${{ matrix.task_id }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'enve.lock', 'pnpm-workspace.yaml') }}
          path: |-
            .enact/state/pnpm-store
            node_modules/.cache
          restore-keys: |-
            ${{ runner.os }}-${{ runner.arch }}-node-v2-${{ matrix.task_id }}-
            ${{ runner.os }}-${{ runner.arch }}-node-v2-
    - name: Record Restored Package Caches
      if: ${{ (steps.runner_caches.outputs.host == '') && !steps.skip.outputs.hit }}
      continue-on-error: true
      run: enact ci cache-delta record
      env:
        ENACT_CACHE_DELTA: |-
          python_l1_cache /tmp/.cache/uv
          python_l1_cache /tmp/.cache/pip
          node_l1_cache .enact/state/pnpm-store
          node_l1_cache node_modules/.cache
    - name: Download the Reach Map
      if: ${{ !steps.skip.outputs.hit }}
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: enact-reach-map
        path: ${{ runner.temp }}/enact-reach
    - name: Plan with the Detected Reach Map
      if: ${{ !steps.skip.outputs.hit }}
      run: |-
        if [ -n "${GITHUB_HEAD_SHA:-}" ] && [ -z "$(git rev-list -n1 --no-walk --ignore-missing --missing=allow-any "$GITHUB_HEAD_SHA" -- 2>/dev/null)" ]; then
          git fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_HEAD_SHA" 2>/dev/null || true
        fi
        if [ -f "$RUNNER_TEMP/enact-reach/map.bin" ]; then
          echo "ENACT_REACH_FILE=$RUNNER_TEMP/enact-reach/map.bin" >> "$GITHUB_ENV"
        fi
      env:
        GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    - name: Fetch the Revisions Selection Ages By
      if: ${{ (matrix.selects_in_job) && !steps.skip.outputs.hit }}
      continue-on-error: true
      run: |-
        FETCH="git fetch --no-tags --depth=1 --filter=blob:none origin"
        # shellcheck disable=SC2046,SC2086 # one word per revision
        set -- $(enact reach revisions --missing 2>/dev/null || true) $ENACT_SELECT_BASE
        if [ "$#" -gt 0 ]; then
          $FETCH "$@" 2>/dev/null || for rev in "$@"; do
            $FETCH "$rev" 2>/dev/null || true
          done
        fi
      env:
        ENACT_SELECT_BASE: ${{ matrix.select_base }}
    - name: Pull Dependencies via enve
      if: ${{ !steps.skip.outputs.hit }}
      run: enact ci deps pull --component --remote signed
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_COMPONENT_DIR: ${{ matrix.component_dir }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENVE_CACHE_CONCURRENCY: "16"
    - name: Check enve Stores into the Host Cache
      if: ${{ (steps.runner_caches.outputs.host != '') && !steps.skip.outputs.hit }}
      run: enact ci check-store
    - name: Install Project Dependencies
      if: ${{ (hashFiles('package.json') != '' && (contains(matrix.technology, 'typescript') || contains(matrix.technology, 'javascript') || contains(matrix.technology, 'node'))) && !steps.skip.outputs.hit }}
      run: |-
        RUN_PREFIX=""
        if command -v enve >/dev/null 2>&1 && [ -f "enve.lock" ]; then
          RUN_PREFIX="enve run --locked -- "
        fi
        set -f
        for arg in ${ENACT_MATRIX_FILTER_ARGS:-}; do set -- "$@" "$arg"; done
        set +f
        echo "📦 Installing project dependencies..."
        ENACT_INSTALL_INPUTS=$(mktemp "$RUNNER_TEMP/enact-install-inputs.XXXXXX")
        sha256sum pnpm-lock.yaml > "$ENACT_INSTALL_INPUTS"
        for input in package.json pnpm-workspace.yaml enve.lock; do
          if [ -f "$input" ]; then sha256sum "$input" >> "$ENACT_INSTALL_INPUTS"; fi
        done
        $RUN_PREFIX pnpm install "$@" --frozen-lockfile --store-dir "${ENACT_PNPM_STORE:-$PWD/.enact/state/pnpm-store}" --offline --config.audit=false --config.minimum-release-age=0 --config.package-import-method=hardlink --config.fetch-retries=2 --config.fetch-retry-maxtimeout=10000 --network-concurrency=16 ||
          $RUN_PREFIX pnpm install "$@" --frozen-lockfile --store-dir "${ENACT_PNPM_STORE:-$PWD/.enact/state/pnpm-store}" --prefer-offline --config.audit=false --config.minimum-release-age=0 --config.package-import-method=hardlink --config.fetch-retries=2 --config.fetch-retry-maxtimeout=10000 --network-concurrency=16 || exit $?
        sha256sum --check "$ENACT_INSTALL_INPUTS"
        rm "$ENACT_INSTALL_INPUTS"
        echo "ENACT_PREPARED=${ENACT_PREPARED:+$ENACT_PREPARED,}node" >> "$GITHUB_ENV"
      env:
        ENACT_MATRIX_FILTER_ARGS: ${{ matrix.filter_args }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Execute Component Task
      if: ${{ !steps.skip.outputs.hit }}
      run: eval "$ENACT_MATRIX_COMMAND"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        CI_COMPONENT: ${{ matrix.component }}
        ENACT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        ENACT_MATRIX_COMMAND: ${{ matrix.command }}
        ENACT_MAX_PARALLEL: ${{ matrix.max_parallel }}
        ENACT_PREEMPTION_NOTICE_SEC: ${{ matrix.preemption_notice_sec }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENACT_RECORD: ${{ (github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch) && 'every' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != github.event.repository.default_branch) && 'auto' || 'off' }}
        ENACT_RUNNER_TIER: ${{ matrix.runner_tier }}
        ENACT_SAME_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != github.event.repository.default_branch }}
        ENACT_TOPOLOGY: ${{ matrix.topology }}
    - name: Push Updated Dependencies to the Remote Cache
      if: ${{ (success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && !steps.skip.outputs.hit }}
      continue-on-error: true
      run: enact ci deps push --signed
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_COMPONENT_DIR: ${{ matrix.component_dir }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENVE_CACHE_CONCURRENCY: "16"
    - name: Upload Execution Telemetry & Workflow Dashboard
      if: ${{ (always()) && !steps.skip.outputs.hit }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: telemetry-${{ matrix.task_id }}
        path: |-
          .enact/state/telemetry.json
          .enact/state/summary.html
          .enact/state/runs/*/services/*.log
          .enact/state/diagnostics/grafana-e2e/*/results/**
          .enact/state/diagnostics/grafana-e2e/*/grafana-server.log
        retention-days: "1"
    - name: Upload Recorded Footprints
      if: ${{ (always() && (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != github.event.repository.default_branch || github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch)) && !steps.skip.outputs.hit }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: enact-footprints-${{ matrix.task_id }}
        path: .enact/state/cache/trace-reach.d/
        retention-days: "1"
    - name: Check Package Caches for New Entries
      id: cache_delta
      if: ${{ (!cancelled() && steps.runner_caches.outputs.host == '' && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && !steps.skip.outputs.hit }}
      continue-on-error: true
      run: enact ci cache-delta check
      env:
        ENACT_CACHE_DELTA: |-
          python_l1_cache /tmp/.cache/uv
          python_l1_cache /tmp/.cache/pip
          node_l1_cache .enact/state/pnpm-store
          node_l1_cache node_modules/.cache
        ENACT_UV_PRUNE: "true"
    - name: Save Python build & venv cache
